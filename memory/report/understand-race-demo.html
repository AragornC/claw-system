<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>理解需求 · 并发竞态 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b1626;
    color: #d5e3f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 28px 20px;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .panel { flex: 1; min-width: 340px; max-width: 480px; }
  .panel-label {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .panel-label.broken { color: #c0392b; }
  .panel-label.fixed  { color: #3a9e6e; }

  .ctrl {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  .ctrl button {
    font-size: 0.72rem; padding: 4px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid #365a89; background: #13263f; color: #c8dcf5;
  }
  .ctrl button:hover { background: #1c3550; }

  .step-card {
    border: 1px solid #1e3255; border-radius: 12px;
    background: #0f1c2e; overflow: hidden;
  }
  .step-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 13px; border-bottom: 1px solid #1e3255;
  }
  .step-icon {
    width: 18px; height: 18px; border-radius: 50%;
    background: #1a7f5a;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .step-icon svg { width: 10px; height: 10px; }
  .step-title { font-size: 0.82rem; font-weight: 600; color: #e8f1ff; }
  .step-badge {
    margin-left: auto; font-size: 0.68rem; color: #3a9e6e;
    background: #0d2b1e; border: 1px solid #1a5c3c; border-radius: 6px; padding: 1px 7px;
  }
  .step-body { padding: 12px 13px; }

  .ai-workbench-understand-progressive {
    border: 1px solid #273654; border-radius: 10px;
    background: #111d32; padding: 10px 12px; display: grid; gap: 8px;
  }
  .ai-workbench-understand-line {
    font-size: 0.78rem; line-height: 1.6; color: #d5e3f8;
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
  }
  .ai-workbench-understand-prefix { color: #d5e3f8; }
  .ai-workbench-understand-inline {
    display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px;
  }
  .ai-workbench-understand-token {
    display: inline-block; border: 1px solid #365a89; background: #13263f;
    color: #e8f1ff; border-radius: 8px; padding: 1px 7px;
    font-size: 0.76rem; line-height: 1.45;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; vertical-align: baseline;
  }
  .ai-workbench-understand-token.task { font-weight: 600; }
  .ai-workbench-understand-token.option { margin-right: 2px; }
  .ai-workbench-understand-token.is-streaming { opacity: 0.7; }

  .log {
    margin-top: 10px; font-size: 0.68rem; color: #546e7a;
    font-family: ui-monospace, monospace; line-height: 1.5;
    background: #080f1a; border: 1px solid #1a2a40; border-radius: 8px;
    padding: 8px 10px; min-height: 60px;
  }
  .log .err { color: #e74c3c; }
  .log .ok  { color: #3a9e6e; }
</style>
</head>
<body>

<!-- ══ 改造前 · 竞态复现 ══ -->
<div class="panel">
  <div class="panel-label broken">改造前 · 守卫在动画之后设置（有竞态）</div>
  <div class="ctrl">
    <button id="btn-broken-once">模拟单次加载</button>
    <button id="btn-broken-race">模拟并发加载（3次）</button>
    <button id="btn-broken-reset">重置</button>
  </div>
  <div class="step-card">
    <div class="step-head">
      <div class="step-icon">
        <svg viewBox="0 0 10 10" fill="none">
          <path d="M2 5l2 2 4-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="step-title">理解需求</span>
      <span class="step-badge">已完成</span>
    </div>
    <div class="step-body">
      <div class="ai-workbench-understand-progressive" id="host-broken">
        <div class="ai-workbench-understand-line" id="task-line-broken" style="display:none">
          <span class="ai-workbench-understand-prefix">- 任务分配：</span>
          <span class="ai-workbench-understand-inline" id="task-inline-broken"></span>
        </div>
        <div class="ai-workbench-understand-line" id="option-line-broken" style="display:none">
          <span class="ai-workbench-understand-prefix">- 选项加载：</span>
          <span class="ai-workbench-understand-inline" id="option-inline-broken"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="log" id="log-broken">等待操作...</div>
</div>

<!-- ══ 改造后 · 乐观锁 ══ -->
<div class="panel">
  <div class="panel-label fixed">改造后 · 守卫在动画之前设置（乐观锁）</div>
  <div class="ctrl">
    <button id="btn-fixed-once">模拟单次加载</button>
    <button id="btn-fixed-race">模拟并发加载（3次）</button>
    <button id="btn-fixed-reset">重置</button>
  </div>
  <div class="step-card">
    <div class="step-head">
      <div class="step-icon">
        <svg viewBox="0 0 10 10" fill="none">
          <path d="M2 5l2 2 4-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="step-title">理解需求</span>
      <span class="step-badge">已完成</span>
    </div>
    <div class="step-body">
      <div class="ai-workbench-understand-progressive" id="host-fixed">
        <div class="ai-workbench-understand-line" id="task-line-fixed" style="display:none">
          <span class="ai-workbench-understand-prefix">- 任务分配：</span>
          <span class="ai-workbench-understand-inline" id="task-inline-fixed"></span>
        </div>
        <div class="ai-workbench-understand-line" id="option-line-fixed" style="display:none">
          <span class="ai-workbench-understand-prefix">- 选项加载：</span>
          <span class="ai-workbench-understand-inline" id="option-inline-fixed"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="log" id="log-fixed">等待操作...</div>
</div>

<script>
// ─── 模拟数据 ───
const MOCK_TRACES = [
  // trace 1: task
  { payload: { schema: "understand_cards_v1", stage: "task",    taskToken: "📝 特征生成任务", optionTokens: [] } },
  // trace 2: options
  { payload: { schema: "understand_cards_v1", stage: "options", taskToken: "📝 特征生成任务",
    optionTokens: ["✅ RSI（相对强弱指数）", "✅ 缩短周期（RSI 从14天改为7天）"] } },
];

// ─── 工具 ───
function waitMs(ms) {
  return new Promise(function(resolve) { setTimeout(resolve, ms); });
}
async function animateTextNode(el, text, opts) {
  const delay = opts.delayMs || 14;
  for (let i = 0; i <= text.length; i++) {
    el.textContent = text.slice(0, i);
    if (i < text.length) await waitMs(delay);
  }
}

// ─── 改造前：守卫在动画之后 ───
async function applyProgressiveBroken(host, tracePayload) {
  const payload = tracePayload;
  if (!payload || payload.schema !== "understand_cards_v1") return;
  if (!(host.__optionTokens instanceof Set)) host.__optionTokens = new Set();

  const taskLine   = host.closest(".step-body").querySelector("[id^='task-line']");
  const taskInline = host.closest(".step-body").querySelector("[id^='task-inline']");
  const optionLine = host.closest(".step-body").querySelector("[id^='option-line']");
  const optionInline = host.closest(".step-body").querySelector("[id^='option-inline']");

  // TASK TOKEN
  if (payload.taskToken && !host.__taskRendered) {
    taskLine.style.display = "";
    const el = document.createElement("span");
    el.className = "ai-workbench-understand-token task";
    taskInline.appendChild(el);
    await animateTextNode(el, payload.taskToken, { delayMs: 14 });
    host.__taskRendered = true; // ← 动画结束后才设守卫（竞态窗口！）
  }

  // OPTION TOKENS
  const options = Array.isArray(payload.optionTokens) ? payload.optionTokens : [];
  for (let i = 0; i < options.length; i++) {
    const tok = options[i];
    if (!tok || host.__optionTokens.has(tok)) continue;
    optionLine.style.display = "";
    const el = document.createElement("span");
    el.className = "ai-workbench-understand-token option";
    optionInline.appendChild(el);
    await animateTextNode(el, tok, { delayMs: 12 });
    host.__optionTokens.add(tok); // ← 动画结束后才设守卫（竞态窗口！）
    if (i < options.length - 1) await waitMs(180);
  }
}

async function loadTracesBroken(traces) {
  const host = document.getElementById("host-broken");
  for (let i = 0; i < traces.length; i++) {
    await applyProgressiveBroken(host, traces[i].payload);
  }
}

// ─── 改造后：守卫在动画之前（乐观锁）───
async function applyProgressiveFixed(host, tracePayload) {
  const payload = tracePayload;
  if (!payload || payload.schema !== "understand_cards_v1") return;
  if (!(host.__optionTokens instanceof Set)) host.__optionTokens = new Set();

  const taskLine   = host.closest(".step-body").querySelector("[id^='task-line']");
  const taskInline = host.closest(".step-body").querySelector("[id^='task-inline']");
  const optionLine = host.closest(".step-body").querySelector("[id^='option-line']");
  const optionInline = host.closest(".step-body").querySelector("[id^='option-inline']");

  // TASK TOKEN
  if (payload.taskToken && !host.__taskRendered) {
    host.__taskRendered = true; // ✅ 乐观锁：先占位，再动画
    taskLine.style.display = "";
    const el = document.createElement("span");
    el.className = "ai-workbench-understand-token task";
    taskInline.appendChild(el);
    await animateTextNode(el, payload.taskToken, { delayMs: 14 });
  }

  // OPTION TOKENS
  const options = Array.isArray(payload.optionTokens) ? payload.optionTokens : [];
  for (let i = 0; i < options.length; i++) {
    const tok = options[i];
    if (!tok || host.__optionTokens.has(tok)) continue;
    host.__optionTokens.add(tok); // ✅ 乐观锁：先占位，再动画
    optionLine.style.display = "";
    const el = document.createElement("span");
    el.className = "ai-workbench-understand-token option";
    optionInline.appendChild(el);
    await animateTextNode(el, tok, { delayMs: 12 });
    if (i < options.length - 1) await waitMs(180);
  }
}

async function loadTracesFixed(traces) {
  const host = document.getElementById("host-fixed");
  for (let i = 0; i < traces.length; i++) {
    await applyProgressiveFixed(host, traces[i].payload);
  }
}

// ─── 日志辅助 ───
function log(id, msg, cls) {
  const el = document.getElementById(id);
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
  if (el.textContent === "等待操作...") el.textContent = "";
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function countTokens(hostId) {
  return document.getElementById(hostId).querySelectorAll(".ai-workbench-understand-token").length;
}

// ─── 重置辅助 ───
function resetHost(hostId, taskLineId, taskInlineId, optionLineId, optionInlineId, logId) {
  const host = document.getElementById(hostId);
  delete host.__taskRendered;
  host.__optionTokens = new Set();
  document.getElementById(taskLineId).style.display = "none";
  document.getElementById(taskInlineId).innerHTML = "";
  document.getElementById(optionLineId).style.display = "none";
  document.getElementById(optionInlineId).innerHTML = "";
  document.getElementById(logId).innerHTML = "";
  log(logId, "已重置");
}

// ─── 按钮逻辑 ───
document.getElementById("btn-broken-once").addEventListener("click", function() {
  log("log-broken", "单次加载开始...");
  Promise.resolve(loadTracesBroken(MOCK_TRACES)).then(function() {
    var n = countTokens("host-broken");
    log("log-broken", "完成，共 " + n + " 个 token（预期 3）", n === 3 ? "ok" : "err");
  });
});

document.getElementById("btn-broken-race").addEventListener("click", function() {
  log("log-broken", "并发3次加载开始（复现竞态）...", "err");
  // 模拟多个调用点几乎同时触发 load（fire-and-forget）
  Promise.resolve(loadTracesBroken(MOCK_TRACES));
  Promise.resolve(loadTracesBroken(MOCK_TRACES));
  Promise.resolve(loadTracesBroken(MOCK_TRACES));
  setTimeout(function() {
    var n = countTokens("host-broken");
    log("log-broken", "完成，共 " + n + " 个 token（预期 3，实际可能 > 3）", n > 3 ? "err" : "ok");
  }, 2000);
});

document.getElementById("btn-broken-reset").addEventListener("click", function() {
  resetHost("host-broken", "task-line-broken", "task-inline-broken", "option-line-broken", "option-inline-broken", "log-broken");
});

document.getElementById("btn-fixed-once").addEventListener("click", function() {
  log("log-fixed", "单次加载开始...");
  Promise.resolve(loadTracesFixed(MOCK_TRACES)).then(function() {
    var n = countTokens("host-fixed");
    log("log-fixed", "完成，共 " + n + " 个 token（预期 3）", n === 3 ? "ok" : "err");
  });
});

document.getElementById("btn-fixed-race").addEventListener("click", function() {
  log("log-fixed", "并发3次加载开始（验证修复）...");
  Promise.resolve(loadTracesFixed(MOCK_TRACES));
  Promise.resolve(loadTracesFixed(MOCK_TRACES));
  Promise.resolve(loadTracesFixed(MOCK_TRACES));
  setTimeout(function() {
    var n = countTokens("host-fixed");
    log("log-fixed", "完成，共 " + n + " 个 token（预期 3）", n === 3 ? "ok" : "err");
  }, 2000);
});

document.getElementById("btn-fixed-reset").addEventListener("click", function() {
  resetHost("host-fixed", "task-line-fixed", "task-inline-fixed", "option-line-fixed", "option-inline-fixed", "log-fixed");
});
</script>
</body>
</html>
