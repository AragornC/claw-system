<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>理解需求风格对照 Demo</title>
  <style>
    html, body {
      margin: 0;
      background: #0b1220;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid #2a3a52;
      border-radius: 8px;
      background: #122035;
      color: #cfe2ff;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    button.active {
      border-color: #4c78aa;
      background: #173150;
    }
    .hint { font-size: 12px; color: #9cb0ce; }
    .panel {
      border: 1px solid #294f79;
      border-radius: 12px;
      background: #101a2a;
      overflow: hidden;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #24324a;
      font-weight: 600;
      color: #d4e5ff;
    }
    .status {
      font-size: 12px;
      color: #9cb0ce;
      font-weight: 500;
    }
    .body {
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      max-height: 72vh;
      overflow: auto;
    }
    .bubble {
      width: fit-content;
      max-width: 85%;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .user {
      margin-left: auto;
      background: #18304f;
    }
    .assistant {
      background: #111d2f;
    }
    .task {
      border: 1px solid #2a3a52;
      border-radius: 10px;
      background: #0f1828;
    }
    .title {
      padding: 8px 10px;
      border-bottom: 1px solid #223149;
      color: #d4e5ff;
      font-weight: 600;
    }
    .step {
      padding: 8px 10px;
      display: grid;
      gap: 6px;
      border-bottom: 1px solid #223149;
    }
    .step:last-child { border-bottom: 0; }
    .step-head {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #cfe2ff;
      font-weight: 600;
    }
    .content {
      border-left: 2px solid #345f8f;
      padding-left: 10px;
      color: #b8cbe5;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .task-card {
      border: 1px solid #2f5f8f;
      border-radius: 8px;
      background: #12263d;
      padding: 7px 9px;
      color: #d8e8ff;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.45;
      white-space: normal;
      width: fit-content;
    }
    .inline-row {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      column-gap: 12px;
      align-items: start;
    }
    .inline-row + .inline-row {
      margin-top: 12px;
    }
    .row-label {
      color: #9db3d5;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin: 0;
      white-space: nowrap;
      width: 64px;
      padding-top: 6px;
    }
    .options-card {
      border: 0;
      background: rgba(16, 27, 43, 0.72);
      border-radius: 8px;
      padding: 5px 7px;
      width: max-content;
      max-width: 100%;
    }
    .option-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chip {
      border: 1px solid #355e8d;
      border-radius: 999px;
      background: #12263f;
      color: #d8e7ff;
      font-size: 11px;
      line-height: 1;
      padding: 6px 10px;
      white-space: nowrap;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button id="styleA" class="active" type="button">风格A 清单确认型</button>
      <button id="styleB" type="button">风格B 一句话归纳型</button>
      <button id="styleC" type="button">风格C 差异高亮型</button>
      <button id="styleD" type="button">风格D 最小流式型</button>
      <button id="replay" type="button">重播</button>
      <span class="hint">同一条任务，切换看“理解需求”文案风格。</span>
    </div>

    <div class="panel">
      <div class="head">
        <span>特征生成任务（理解需求风格对照）</span>
        <span class="status" id="status">等待中</span>
      </div>
      <div class="body" id="body"></div>
    </div>
  </div>

  <script>
    const body = document.getElementById("body");
    const status = document.getElementById("status");
    const btnA = document.getElementById("styleA");
    const btnB = document.getElementById("styleB");
    const btnC = document.getElementById("styleC");
    const btnD = document.getElementById("styleD");
    const replayBtn = document.getElementById("replay");

    let style = "A";
    let timer = null;
    let stepIdx = 0;

    const understandByStyle = {
      A: [
        "本次任务：特征加工任务",
        "已加载本次用户选择：",
        "- 输出类型：连续值",
        "- 时间尺度：短中期",
        "- 风格偏好：稳健",
      ].join("\n"),
      B: [
        "我理解你的本次任务是：做一个特征加工任务。",
        "本次选择：连续值输出 / 短中期窗口 / 稳健风格。",
      ].join("\n"),
      C: [
        "本次变化项：",
        "- 时间尺度：短中期（上次：中长期）",
        "- 风格偏好：稳健（上次：进取）",
        "沿用项：输出类型=连续值",
      ].join("\n"),
      D: [
        "已加载本次用户选择：连续值、短中期、稳健。",
      ].join("\n"),
    };

    const styleBOptions = [
      "任务：特征加工",
      "输出：连续值",
      "时间：短中期",
      "风格：稳健",
    ];

    function setActiveButton() {
      [btnA, btnB, btnC, btnD].forEach((b) => b.classList.remove("active"));
      if (style === "A") btnA.classList.add("active");
      if (style === "B") btnB.classList.add("active");
      if (style === "C") btnC.classList.add("active");
      if (style === "D") btnD.classList.add("active");
    }

    function addBubble(text, cls) {
      const el = document.createElement("div");
      el.className = "bubble " + cls;
      el.textContent = text;
      body.appendChild(el);
      body.scrollTop = body.scrollHeight;
    }

    function renderTaskShell() {
      const task = document.createElement("div");
      task.className = "task";
      task.innerHTML = ""
        + '<div class="title">特征生成任务（过程保持展开）</div>'
        + '<div class="step"><div class="step-head"><span>理解需求</span><span id="s1">进行中</span></div><div class="content" id="u"></div></div>'
        + '<div class="step"><div class="step-head"><span>生成计划</span><span id="s2">等待中</span></div><div class="content" id="p">（这里继续做思考流 + 计划卡）</div></div>';
      body.appendChild(task);
      return task;
    }

    function renderUnderstandContent() {
      const node = document.getElementById("u");
      if (!node) return;
      if (style !== "B") {
        node.textContent = understandByStyle[style];
        return;
      }
      node.innerHTML = ""
        + '<div class="inline-row">'
        + '  <div class="row-label">任务分配</div>'
        + '  <div class="task-card">特征任务</div>'
        + "</div>"
        + '<div class="inline-row">'
        + '  <div class="row-label">选项加载</div>'
        + '  <div class="options-card"><div class="option-chips">'
        + styleBOptions.filter(function(item) { return item.indexOf("任务：") !== 0; }).map(function(item) {
          return '<span class="chip">' + item + "</span>";
        }).join("")
        + "  </div></div>"
        + "</div>";
    }

    function reset() {
      if (timer) clearInterval(timer);
      timer = null;
      stepIdx = 0;
      body.innerHTML = "";
      status.textContent = "等待中";
      addBubble("帮我生成一个用于判断市场波动率高低的特征。", "user");
      addBubble("收到，我先做理解需求，再进入生成计划。", "assistant");
      renderTaskShell();
    }

    const scene = [
      function() {
        status.textContent = "理解需求中";
        renderUnderstandContent();
        document.getElementById("s1").textContent = "已完成";
      },
      function() {
        status.textContent = "生成计划中";
        document.getElementById("s2").textContent = "进行中";
        document.getElementById("p").textContent = "AI 思考过程...\n先收敛目标，再生成可执行计划。";
      },
      function() {
        status.textContent = "已完成";
        document.getElementById("s2").textContent = "已完成";
        document.getElementById("p").textContent = "本次任务计划：\n- 需求\n- 方法\n- 验证\n- 修复";
      },
    ];

    function play() {
      if (timer) clearInterval(timer);
      stepIdx = 0;
      timer = setInterval(() => {
        if (stepIdx >= scene.length) {
          clearInterval(timer);
          timer = null;
          return;
        }
        scene[stepIdx]();
        stepIdx += 1;
      }, 650);
    }

    function switchStyle(next) {
      style = next;
      setActiveButton();
      reset();
      play();
    }

    btnA.addEventListener("click", () => switchStyle("A"));
    btnB.addEventListener("click", () => switchStyle("B"));
    btnC.addEventListener("click", () => switchStyle("C"));
    btnD.addEventListener("click", () => switchStyle("D"));
    replayBtn.addEventListener("click", () => { reset(); play(); });

    reset();
    play();
  </script>
</body>
</html>
