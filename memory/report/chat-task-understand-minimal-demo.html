<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>理解需求极简 Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1220;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px;
      box-sizing: border-box;
      display: grid;
      gap: 10px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      border: 1px solid #2a3a52;
      border-radius: 8px;
      background: #122035;
      color: #cfe2ff;
      padding: 6px 10px;
      cursor: pointer;
    }
    .hint { font-size: 12px; color: #9cb0ce; }
    .chat {
      border: 1px solid #294f79;
      border-radius: 12px;
      background: #101a2a;
      overflow: hidden;
    }
    .head {
      padding: 10px 12px;
      border-bottom: 1px solid #20324b;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      color: #d4e5ff;
    }
    .status { font-size: 12px; color: #9cb0ce; font-weight: 500; }
    .body {
      max-height: 72vh;
      overflow: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bubble {
      width: fit-content;
      max-width: 84%;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      margin-left: auto;
      background: #18304f;
    }
    .bubble.assistant {
      background: #111d2f;
    }
    .task {
      border: 1px solid #294f79;
      border-radius: 10px;
      background: #0f1828;
    }
    .task-title {
      padding: 8px 10px;
      border-bottom: 1px solid #24324a;
      font-weight: 600;
      color: #d4e5ff;
    }
    .step {
      padding: 8px 10px;
      border-bottom: 1px solid #213149;
      display: grid;
      gap: 6px;
    }
    .step:last-child { border-bottom: 0; }
    .step-head {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #cfdef3;
      font-weight: 600;
    }
    .step-content {
      border-left: 2px solid #325b89;
      padding-left: 8px;
      color: #b8cbe5;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .hidden { display: none; }
    .plan-card {
      border: 1px solid #2a3a52;
      border-radius: 8px;
      background: #0f1c2d;
      padding: 8px;
      display: grid;
      gap: 6px;
    }
    .label {
      font-size: 12px;
      color: #9db3d5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <button id="startBtn" type="button">开始演示</button>
      <button id="resetBtn" type="button">重置</button>
      <span class="hint">理解需求只展示本次用户选择，不展示固定黑话。</span>
    </div>

    <div class="chat">
      <div class="head">
        <span>特征生成任务（极简版）</span>
        <span class="status" id="statusText">等待中</span>
      </div>
      <div class="body" id="chatBody"></div>
    </div>
  </div>

  <script>
    const chatBody = document.getElementById("chatBody");
    const statusText = document.getElementById("statusText");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");

    let timer = null;
    let idx = 0;
    let thinking = "";
    let taskEl = null;

    function toBottom() {
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function addBubble(text, cls) {
      const node = document.createElement("div");
      node.className = "bubble " + cls;
      node.textContent = text;
      chatBody.appendChild(node);
      toBottom();
      return node;
    }

    function ensureTask() {
      if (taskEl) return taskEl;
      taskEl = document.createElement("div");
      taskEl.className = "task";
      taskEl.innerHTML = ""
        + '<div class="task-title">特征生成任务（过程始终展开）</div>'
        + '<div class="step" data-step="understand">'
        + '  <div class="step-head"><span>理解需求</span><span id="s1">进行中</span></div>'
        + '  <div class="step-content" id="understandContent"></div>'
        + '</div>'
        + '<div class="step hidden" data-step="plan">'
        + '  <div class="step-head"><span>生成计划</span><span id="s2">进行中</span></div>'
        + '  <div class="step-content"><div class="label">AI 思考过程</div><div id="thinkingText"></div></div>'
        + '  <div class="plan-card hidden" id="planCard">'
        + '    <div><span class="label">我理解到的需求</span><div id="p1"></div></div>'
        + '    <div><span class="label">我将怎么做</span><div id="p2"></div></div>'
        + '    <div><span class="label">我会如何验证</span><div id="p3"></div></div>'
        + '    <div><span class="label">若失败怎么修复</span><div id="p4"></div></div>'
        + '  </div>'
        + '</div>';
      chatBody.appendChild(taskEl);
      toBottom();
      return taskEl;
    }

    function showUnderstandSelection() {
      const node = document.getElementById("understandContent");
      node.textContent = [
        "本次任务：特征加工任务",
        "已加载本次用户选择：",
        "- 输出类型：连续值",
        "- 时间尺度：短中期",
        "- 风格偏好：稳健",
      ].join("\n");
      document.getElementById("s1").textContent = "已完成";
      toBottom();
    }

    function revealPlanStep() {
      const planStep = taskEl.querySelector('[data-step="plan"]');
      planStep.classList.remove("hidden");
      toBottom();
    }

    function appendThinking(text) {
      thinking += text + "\n";
      document.getElementById("thinkingText").textContent = thinking.trim();
      toBottom();
    }

    function fillPlan() {
      const card = document.getElementById("planCard");
      card.classList.remove("hidden");
      document.getElementById("p1").textContent = "识别并量化市场波动率高低。";
      document.getElementById("p2").textContent = "构建连续评分特征并做平滑处理。";
      document.getElementById("p3").textContent = "检查空值、方差与区分度。";
      document.getElementById("p4").textContent = "若信号过噪，回退参数并重算。";
      document.getElementById("s2").textContent = "已完成";
      toBottom();
    }

    function reset() {
      if (timer) clearInterval(timer);
      timer = null;
      idx = 0;
      thinking = "";
      taskEl = null;
      chatBody.innerHTML = "";
      addBubble("帮我做一个判断市场波动率高低的特征。", "user");
      addBubble("收到，先确认你的本次选择，再开始生成计划。", "assistant");
      ensureTask();
      statusText.textContent = "等待中";
      startBtn.disabled = false;
      toBottom();
    }

    const steps = [
      () => { statusText.textContent = "理解需求中"; showUnderstandSelection(); },
      () => { statusText.textContent = "生成计划中"; revealPlanStep(); },
      () => appendThinking("先收敛目标：把波动率高低转成可连续评估的分数。"),
      () => appendThinking("再定路线：用波动率变化率 + 平滑处理，保证稳定。"),
      () => appendThinking("验证方式：看空值、波动区分度、时段一致性。"),
      () => { fillPlan(); statusText.textContent = "已完成"; addBubble("计划已生成，准备进入后续代码阶段。", "assistant"); },
    ];

    function start() {
      if (timer) return;
      startBtn.disabled = true;
      timer = setInterval(() => {
        if (idx >= steps.length) {
          clearInterval(timer);
          timer = null;
          startBtn.disabled = false;
          return;
        }
        steps[idx]();
        idx += 1;
      }, 720);
    }

    startBtn.addEventListener("click", start);
    resetBtn.addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
