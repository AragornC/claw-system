<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 管理面板 v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#090d16;--bg2:#0f1624;--bg3:#131c2e;--bg4:#1a2332;
  --bg-hover:rgba(255,255,255,.035);--bg-active:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --t1:#e2e8f0;--t2:#94a3b8;--t3:#4a6580;--t4:#2e3f52;
  --green:#3cc87a;--gold:#e8a84a;--blue:#60a5fa;--purple:#a78bfa;--cyan:#22d3ee;--red:#ef5350;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  --mono:"SF Mono","JetBrains Mono",monospace;
}
body{background:#060912;font-family:var(--font);font-size:13px;color:var(--t1);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
.demo-hint{font-size:11px;color:var(--t3);margin-bottom:14px;text-align:center;letter-spacing:.4px;}

.app-shell{display:flex;width:980px;height:660px;border-radius:12px;overflow:hidden;border:1px solid var(--border2);box-shadow:0 24px 80px rgba(0,0,0,.6);}

/* ── Icon Rail ── */
.rail{width:44px;flex-shrink:0;background:#070b13;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;gap:2px;}
.rail-btn{width:32px;height:32px;border:none;border-radius:7px;background:transparent;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;position:relative;}
.rail-btn:hover{color:var(--t1);background:var(--bg-hover);}
.rail-btn.active{color:var(--t1);background:var(--bg-active);}
.rail-btn.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2.5px;height:18px;background:var(--green);border-radius:0 2px 2px 0;}
.rail-spacer{flex:1;}

/* ── Sidebar ── */
.sidebar{width:216px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-body{flex:1;overflow-y:auto;overflow-x:hidden;}
.sb-body::-webkit-scrollbar{width:3px;}
.sb-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* section header */
.sec-hd{display:flex;align-items:center;padding:11px 12px 6px;font-size:9.5px;font-weight:700;letter-spacing:.7px;color:var(--t3);text-transform:uppercase;cursor:pointer;user-select:none;transition:color .12s;}
.sec-hd:hover{color:var(--t2);}
.sec-chev{width:11px;height:11px;display:flex;align-items:center;justify-content:center;margin-right:5px;transition:transform .15s;flex-shrink:0;transform:rotate(90deg);}
.sec.collapsed .sec-chev{transform:rotate(0);}
.sec-label{flex:1;}
.sec-count{font-size:9px;color:var(--t4);font-weight:400;letter-spacing:0;}
.sec-body{overflow:hidden;max-height:800px;transition:max-height .2s ease,opacity .15s;opacity:1;}
.sec.collapsed .sec-body{max-height:0;opacity:0;}

/* add button inline */
.sec-add{width:18px;height:18px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;margin-right:2px;transition:all .12s;flex-shrink:0;}
.sec-add:hover{color:var(--green);border-color:rgba(60,200,122,.4);background:rgba(60,200,122,.05);}

/* sidebar row */
.sb-row{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;cursor:pointer;transition:background .1s;border-left:2px solid transparent;}
.sb-row:hover{background:var(--bg-hover);}
.sb-row.sel{background:var(--bg-active);border-left-color:var(--green);}
.sb-row-icon{flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--t3);}
.sb-row.sel .sb-row-icon{color:var(--t1);}
.sb-row-label{flex:1;font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-row.sel .sb-row-label{color:var(--t1);}
.sb-row-sub{font-size:9.5px;color:var(--t4);}
.status-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.dot-on{background:var(--green);}
.dot-off{background:var(--t4);}

/* perm badge small */
.perm-s{font-size:8.5px;padding:1px 5px;border-radius:3px;font-weight:600;flex-shrink:0;}
.perm-auto{background:rgba(60,200,122,.08);color:var(--green);border:1px solid rgba(60,200,122,.14);}
.perm-ask{background:rgba(232,168,74,.08);color:var(--gold);border:1px solid rgba(232,168,74,.14);}
.perm-deny{background:rgba(239,83,80,.08);color:var(--red);border:1px solid rgba(239,83,80,.14);}

/* ── Main area ── */
.main{flex:1;background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;}

/* main header bar */
.main-header{display:flex;align-items:center;padding:7px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.mh-left{display:flex;align-items:center;gap:10px;flex:1;}
.mh-right{display:flex;align-items:center;gap:8px;}
.mh-label{font-size:11px;color:var(--t3);}
.main-act-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--t3);font-size:11px;cursor:pointer;font-family:var(--font);transition:all .12s;}
.main-act-btn:hover{color:var(--green);border-color:rgba(60,200,122,.35);background:rgba(60,200,122,.05);}

/* slide toggle for skill views */
.slide-toggle{
  display:flex;align-items:center;
  background:rgba(0,0,0,.3);border-radius:6px;
  padding:2px;gap:0;border:1px solid var(--border);
}
.slide-opt{
  padding:4px 14px;border-radius:4px;font-size:10.5px;
  color:var(--t3);cursor:pointer;transition:all .15s;
  font-family:var(--font);border:none;background:transparent;
  white-space:nowrap;
}
.slide-opt:hover{color:var(--t2);}
.slide-opt.active{background:var(--bg-active);color:var(--t1);}

/* validation bar */
.valid-bar{
  display:flex;align-items:center;gap:8px;
  padding:6px 16px;border-bottom:1px solid var(--border);
  font-size:10.5px;flex-shrink:0;
  transition:background .2s;
}
.valid-bar.ok{background:rgba(60,200,122,.04);color:var(--green);}
.valid-bar.warn{background:rgba(232,168,74,.06);color:var(--gold);}
.valid-bar.err{background:rgba(239,83,80,.06);color:var(--red);}
.valid-icon{flex-shrink:0;}
.valid-msg{flex:1;}
.valid-items{display:flex;gap:6px;flex-wrap:wrap;}
.valid-item{font-size:9.5px;padding:1px 6px;border-radius:3px;}
.valid-item.pass{background:rgba(60,200,122,.08);color:var(--green);border:1px solid rgba(60,200,122,.14);}
.valid-item.fail{background:rgba(239,83,80,.08);color:var(--red);border:1px solid rgba(239,83,80,.14);}
.valid-item.warn-item{background:rgba(232,168,74,.08);color:var(--gold);border:1px solid rgba(232,168,74,.14);}

/* custom section in skill visual */
.sv-custom{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:12px;background:rgba(255,255,255,.01);}
.sv-custom-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.sv-custom-title{font-size:10.5px;font-weight:700;color:var(--t2);font-family:var(--mono);background:transparent;border:1px solid transparent;border-radius:3px;padding:2px 4px;outline:none;transition:border-color .12s;}
.sv-custom-title:focus{border-color:rgba(96,165,250,.3);}
.sv-custom-badge{font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(34,211,238,.06);color:var(--cyan);border:1px solid rgba(34,211,238,.12);}
.sv-custom-rm{margin-left:auto;width:16px;height:16px;border:none;border-radius:3px;background:transparent;color:var(--t4);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.sv-custom-rm:hover{color:var(--red);background:rgba(239,83,80,.08);}

.main-body{flex:1;overflow-y:auto;padding:18px 22px;}
.main-body::-webkit-scrollbar{width:4px;}
.main-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;}
.empty-icon{color:var(--t4);}
.empty-text{font-size:12px;color:var(--t3);}

/* ── Agent / Skill detail (markdown-style) ── */
.md-h1{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:4px;display:flex;align-items:center;gap:10px;}
.md-h1 svg{color:var(--t2);}
.md-badge{font-size:9.5px;padding:2px 8px;border-radius:4px;font-weight:600;}
.md-meta{font-size:11px;color:var(--t3);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.md-sep{height:1px;background:var(--border);margin:14px 0;}
.md-p{font-size:12px;color:var(--t2);line-height:1.75;margin-bottom:14px;}
.md-h2{font-size:10.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;margin-top:2px;}

/* skill list in agent detail */
.skill-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.skill-row-card{border:1px solid var(--border);border-radius:7px;background:rgba(255,255,255,.015);overflow:hidden;transition:border-color .12s;}
.skill-row-card:hover{border-color:var(--border2);}
.skill-row-top{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;transition:background .1s;}
.skill-row-top:hover{background:var(--bg-hover);}
.skill-row-name{font-size:12px;color:var(--t1);font-family:var(--mono);flex-shrink:0;min-width:140px;}
.skill-row-desc{font-size:10.5px;color:var(--t3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.skill-row-link{font-size:10px;color:var(--t4);flex-shrink:0;}
.skill-row-top:hover .skill-row-link{color:var(--blue);}
.skill-row-fns{display:flex;flex-wrap:wrap;gap:4px;padding:5px 10px 7px;border-top:1px solid var(--border);background:rgba(0,0,0,.12);}
.skill-fn-tag{font-size:9.5px;font-family:var(--mono);color:var(--t2);padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.03);border:1px solid var(--border);cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:4px;}
.skill-fn-tag:hover{border-color:var(--border2);color:var(--blue);}
.skill-fn-perm{font-size:8px;font-family:var(--font);opacity:.6;}

/* function chips for agent */
.fn-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.fn-chip{font-size:10.5px;padding:3px 9px;border-radius:5px;font-family:var(--mono);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:5px;}
.fn-chip:hover{border-color:var(--border2);}

/* toggle */
.toggle{width:28px;height:15px;border-radius:8px;background:var(--t4);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:white;transition:left .2s;}
.toggle.on::after{left:15px;}

/* ── Function detail ── */
.fn-header{margin-bottom:14px;}
.fn-name{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--t1);margin-bottom:4px;}
.fn-desc{font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:4px;}

/* params table */
.params-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:14px;}
.params-table th{text-align:left;padding:6px 8px;font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);font-weight:600;}
.params-table td{padding:6px 8px;border-bottom:1px solid var(--border);color:var(--t2);vertical-align:top;}
.params-table tr:last-child td{border-bottom:none;}
.param-name{font-family:var(--mono);color:var(--blue);}
.param-type{font-family:var(--mono);color:var(--gold);font-size:10.5px;}
.param-req{color:var(--red);font-size:10px;}
.param-opt{color:var(--t4);font-size:10px;}

/* agent tags in fn detail */
.agent-tags{display:flex;flex-wrap:wrap;gap:5px;}
.agent-tag{font-size:10.5px;padding:3px 9px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--t2);display:flex;align-items:center;gap:5px;}

/* perm selector */
.perm-sel{display:flex;gap:6px;}
.perm-opt{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--t3);font-size:11px;cursor:pointer;transition:all .12s;font-family:var(--font);}
.perm-opt:hover{border-color:var(--border2);color:var(--t2);}
.perm-opt.sel-auto{border-color:rgba(60,200,122,.4);color:var(--green);background:rgba(60,200,122,.06);}
.perm-opt.sel-ask{border-color:rgba(232,168,74,.4);color:var(--gold);background:rgba(232,168,74,.06);}
.perm-opt.sel-deny{border-color:rgba(239,83,80,.4);color:var(--red);background:rgba(239,83,80,.06);}

/* register modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s;}
.overlay.show{opacity:1;pointer-events:all;}
.modal{width:500px;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:22px 24px;transform:scale(.96);transition:transform .2s;}
.overlay.show .modal{transform:scale(1);}
.modal-title{font-size:13.5px;font-weight:700;margin-bottom:2px;}
.modal-sub{font-size:11px;color:var(--t3);margin-bottom:18px;}
.form-label{font-size:10.5px;color:var(--t3);margin-bottom:5px;}
.form-input{width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:var(--t1);font-size:12px;font-family:var(--font);outline:none;margin-bottom:12px;}
.form-input:focus{border-color:rgba(60,200,122,.4);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.perm-row{display:flex;gap:6px;margin-bottom:12px;}
.perm-pill{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--t3);font-size:11px;cursor:pointer;font-family:var(--font);transition:all .12s;}
.perm-pill:hover{border-color:var(--border2);color:var(--t2);}
.perm-pill.active-auto{border-color:rgba(60,200,122,.4);color:var(--green);background:rgba(60,200,122,.06);}
.perm-pill.active-ask{border-color:rgba(232,168,74,.4);color:var(--gold);background:rgba(232,168,74,.06);}
.perm-pill.active-deny{border-color:rgba(239,83,80,.4);color:var(--red);background:rgba(239,83,80,.06);}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.btn{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-family:var(--font);transition:all .12s;}
.btn-ghost{background:transparent;color:var(--t3);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--t1);border-color:var(--border2);}
.btn-primary{background:var(--green);color:#07130e;font-weight:600;}
.btn-primary:hover{opacity:.88;}

/* code block style */
.code-block{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:10.5px;color:var(--t2);line-height:1.7;margin-bottom:14px;overflow-x:auto;}

/* system prompt area */
.prompt-area{
  background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;margin-bottom:14px;
  font-size:12px;color:var(--t2);line-height:1.8;
  white-space:pre-wrap;font-family:var(--font);
  max-height:260px;overflow-y:auto;
  cursor:text;position:relative;
}
.prompt-area::-webkit-scrollbar{width:3px;}
.prompt-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.prompt-area .h2{color:var(--t3);font-weight:700;font-size:11px;letter-spacing:.3px;}
.prompt-area .hl{color:var(--gold);}
.prompt-edit-hint{
  position:absolute;top:8px;right:10px;
  font-size:9.5px;color:var(--t4);pointer-events:none;
}

/* memory tag */
.memory-tag{
  display:flex;align-items:flex-start;gap:8px;
  padding:9px 12px;border-radius:6px;
  background:rgba(34,211,238,.04);border:1px solid rgba(34,211,238,.1);
  font-size:11.5px;color:var(--t2);line-height:1.6;
  margin-bottom:14px;
}
.memory-tag svg{flex-shrink:0;margin-top:2px;color:var(--cyan);}

/* skill editor */
.skill-editor{
  width:100%;min-height:220px;max-height:400px;resize:vertical;
  background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;margin-bottom:16px;
  font-size:12px;color:var(--t2);line-height:1.8;
  font-family:var(--font);outline:none;
  tab-size:2;
}
.skill-editor:focus{border-color:rgba(96,165,250,.3);}
.skill-editor::-webkit-scrollbar{width:3px;}
.skill-editor::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── Skill visual editor ── */
.sv-section{margin-bottom:16px;}
.sv-label{font-size:9.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;}
.sv-input{
  width:100%;padding:8px 10px;border-radius:6px;
  border:1px solid var(--border);background:rgba(0,0,0,.2);
  color:var(--t1);font-size:12px;font-family:var(--font);outline:none;
  transition:border-color .12s;
}
.sv-input:focus{border-color:rgba(96,165,250,.3);}

.sv-tools{display:flex;flex-direction:column;gap:3px;}
.sv-tool-row{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:rgba(0,0,0,.12);transition:border-color .12s;}
.sv-tool-row:hover{border-color:var(--border2);}
.sv-tool-name{font-size:11.5px;font-family:var(--mono);color:var(--blue);min-width:135px;flex-shrink:0;cursor:pointer;}
.sv-tool-name:hover{text-decoration:underline;}
.sv-tool-missing{color:var(--red) !important;cursor:default !important;}
.sv-tool-missing:hover{text-decoration:none !important;}
.sv-tool-desc{font-size:10.5px;color:var(--t3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sv-tool-rm{width:18px;height:18px;border:none;border-radius:3px;background:transparent;color:var(--t4);cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;}
.sv-tool-rm:hover{color:var(--red);background:rgba(239,83,80,.08);}
.sv-add-tool{border:1px dashed var(--border);background:transparent;color:var(--t4);padding:6px;border-radius:5px;font-size:11px;cursor:pointer;font-family:var(--font);margin-top:4px;transition:all .12s;}
.sv-add-tool:hover{border-color:var(--border2);color:var(--t2);}

.sv-list{display:flex;flex-direction:column;gap:3px;}
.sv-list-item{display:flex;align-items:center;gap:6px;}
.sv-list-num{font-size:10.5px;color:var(--t4);font-family:var(--mono);width:16px;text-align:right;flex-shrink:0;}
.sv-list-bullet{font-size:12px;flex-shrink:0;width:16px;text-align:center;}
.sv-list-input{
  flex:1;padding:5px 8px;border-radius:4px;
  border:1px solid var(--border);background:rgba(0,0,0,.15);
  color:var(--t2);font-size:11.5px;font-family:var(--font);outline:none;
  transition:border-color .12s;
}
.sv-list-input:focus{border-color:rgba(96,165,250,.3);color:var(--t1);}
.sv-list-rm{width:16px;height:16px;border:none;border-radius:3px;background:transparent;color:var(--t4);cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:all .12s;}
.sv-list-item:hover .sv-list-rm{opacity:1;}
.sv-list-rm:hover{color:var(--red);background:rgba(239,83,80,.08);}
.sv-add-item{border:none;background:transparent;color:var(--t4);padding:4px 0;font-size:10.5px;cursor:pointer;font-family:var(--font);margin-top:4px;transition:color .12s;text-align:left;}
.sv-add-item:hover{color:var(--blue);}

/* workflow layout */
.sv-wf-list{display:flex;flex-direction:column;gap:0;}

.wf-row{display:flex;align-items:stretch;gap:0;}
.wf-gutter{display:flex;flex-direction:column;align-items:center;width:32px;flex-shrink:0;}
.sv-wf-num{
  width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--border2);background:var(--bg3);

你不负责仓位计算和风险评估，这些由 Risk 角色完成。你的分析仅供参考，不构成投资建议。`,

    systemPrompt:`你是一个严谨的量化研究员。你的工作是设计、实现和验证交易因子与策略。

## 认知偏向
- 你对统计显著性有极高要求，拒绝没有数据支撑的直觉判断

## 局限性声明

    systemPrompt:`你是一个保守的风控官。你的核心原则是：保住本金比赚钱更重要。

## 认知偏向

- 同等条件下，你倾向于建议更小的仓位

## 沟通风格

## 局限性声明

let curType=null, curId=null, curTab='detail';

function selectItem(type, id){
  document.querySelectorAll('.sb-row').forEach(r=>r.classList.remove('sel'));
  const el = document.getElementById(`${type==='agent'?'ar':type==='skill'?'sr':'fr'}-${id}`);
  if(el) el.classList.add('sel');
  curType=type; curId=id; curTab='detail';
  validState = null; pendingMdText = null; mdDirty = false;

  const header = document.getElementById('mainHeader');
  header.style.display = 'flex';
  const mhL = document.getElementById('mhLeft');
  const mhR = document.getElementById('mhRight');

  if(type==='skill'){
    mhL.innerHTML = `<div class="slide-toggle">
      <button class="slide-opt active" onclick="switchTab('detail',this)">可视化</button>
      <button class="slide-opt" onclick="switchTab('code',this)">SKILL.md</button>
    </div>`;
    mhR.innerHTML = `<button class="main-act-btn" id="saveBtn" onclick="saveSkill()">保存更改</button>`;
  } else if(type==='fn'){
    mhL.innerHTML = `<div class="slide-toggle">
      <button class="slide-opt active" onclick="switchTab('detail',this)">详情</button>
      <button class="slide-opt" onclick="switchTab('code',this)">Schema</button>
    </div>`;
    mhR.innerHTML = `<button class="main-act-btn">保存更改</button>`;
  } else {
    mhL.innerHTML = `<span class="mh-label">配置</span>`;
    mhR.innerHTML = `<button class="main-act-btn">保存更改</button>`;
  }
  renderMain();
}

function switchTab(t, btn){
  if(curType==='skill' && curTab==='code' && t==='detail'){
    const ta = document.querySelector('.skill-editor');
    if(ta) pendingMdText = ta.value;
    if(pendingMdText && mdDirty){
      const sk = SKILLS.find(s=>s.id===curId);
      const parsed = parseMd(pendingMdText);
      const tempSk = Object.assign({}, sk, parsed);
      const issues = validateSkill(tempSk);

      if(parsed._dropped && parsed._dropped.length > 0){
        parsed._dropped.forEach(d=>{
          issues.push({type:'warn', msg:`[${d.section}] 格式不符已忽略: "${d.line}"`});
        });
      }

      if(issues.some(i=>i.type==='err')){
        validState = {issues, saved:false};
        renderMdValidBar();
        toast('存在校验错误，请先修复再切换');
        return;
      }
      applyParsed(sk, parsed);
      pendingMdText = null;
      mdDirty = false;
      validState = issues.length > 0 ? {issues, saved:false} : null;
    } else {
      validState = null;
    }
  }

  curTab=t;
  if(btn){
    btn.parentElement.querySelectorAll('.slide-opt').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  renderMain();
}

/* ══ Validation ══ */
let validState = null; // null=hidden, {issues,saved}

function validateSkill(sk){
  const issues = [];
  const knownFns = FUNCTIONS.map(f=>f.id);
  if(!sk.desc || sk.desc.trim().length < 5) issues.push({type:'err', msg:'描述不能为空或过短'});
  if(!sk.fns || sk.fns.length === 0) issues.push({type:'err', msg:'至少需要一个 Tool'});
  sk.fns.forEach(fid=>{
    if(!knownFns.includes(fid)) issues.push({type:'err', msg:`Tool "${fid}" 未在 Function 注册表中找到`});
  });
  if(!sk.guide || sk.guide.trim().length < 10) issues.push({type:'warn', msg:'指引内容过短'});
  if(!sk.constraints || sk.constraints.length === 0) issues.push({type:'warn', msg:'建议添加至少一条 Constraint'});
  if(!sk.eval || sk.eval.length === 0) issues.push({type:'warn', msg:'建议添加至少一条 Evaluator 标准'});
  return issues;
}

function renderValidBar(){
  if(!validState) return '';
  const {issues, saved} = validState;
  if(issues.length === 0 && saved){
    return `<div class="valid-bar ok"><span class="valid-icon">✓</span><span class="valid-msg">已保存</span></div>`;
  }
  if(issues.length === 0) return '';
  const hasErr = issues.some(i=>i.type==='err');
  const cls = hasErr ? 'err' : 'warn';
  const icon = hasErr ? '✗' : '!';
  const prefix = hasErr && saved ? '保存失败 — ' : '';
  return `<div class="valid-bar ${cls}">
    <span class="valid-icon">${icon}</span>
    <span class="valid-msg">${prefix}</span>
    <div class="valid-items">${issues.map(i=>`<span class="valid-item ${i.type==='err'?'fail':'warn-item'}">${i.msg}</span>`).join('')}</div>
  </div>`;
}

/* ══ Parse SKILL.md text → structured object (non-destructive) ══ */
let pendingMdText = null;
let mdDirty = false;

function onMdEdit(el){
  pendingMdText = el.value;
  mdDirty = true;
  // hide stale validation
  validState = null;
  const vb = document.getElementById('validBarSlot');
  if(vb) vb.innerHTML = '';
}

function parseListItems(text){
  return text.split('\n')
    .filter(l => /^-\s*\S/.test(l))
    .map(l => l.replace(/^-\s*/, ''));
}

function parseMd(md){
  const parsed = {};
  parsed._dropped = [];

  const descMatch = md.match(/description:\s*>-\s*\n\s*(.+)/);
  if(descMatch) parsed.desc = descMatch[1].trim();

  const toolsSec = md.match(/## Tools\s*\n\n([\s\S]*?)(?=\n##\s|\s*$)/);
  if(toolsSec){
    const allLines = toolsSec[1].split('\n').filter(l=>l.trim());
    const fns = [];
    allLines.forEach(l=>{
      const m = l.match(/`([^`]+)`/);
      if(m) fns.push(m[1]);
      else if(l.trim() && !/^-\s*$/.test(l)) parsed._dropped.push({section:'Tools', line:l.trim()});
    });
    if(fns.length) parsed.fns = fns;
  }

  const instrSec = md.match(/## Instructions\s*\n\n([\s\S]*?)(?=\n##\s|\s*$)/);
  if(instrSec) parsed.guide = instrSec[1].trim();

  const csSec = md.match(/## Constraints\s*\n\n([\s\S]*?)(?=\n##\s|\s*$)/);
  if(csSec){
    const allLines = csSec[1].split('\n').filter(l=>l.trim());
    parsed.constraints = [];
    allLines.forEach(l=>{
      if(/^-\s*\S/.test(l)) parsed.constraints.push(l.replace(/^-\s*/,''));
      else parsed._dropped.push({section:'Constraints', line:l.trim()});
    });
  }

  const evSec = md.match(/## Evaluator\s*\n\n([\s\S]*?)(?=\n##\s|\s*$)/);
  if(evSec){
    const allLines = evSec[1].split('\n').filter(l=>l.trim());
    parsed.eval = [];
    allLines.forEach(l=>{
      if(/^-\s*\S/.test(l)) parsed.eval.push(l.replace(/^-\s*/,''));
      else parsed._dropped.push({section:'Evaluator', line:l.trim()});
    });
  }

  const knownH2 = ['Tools','Instructions','Constraints','Evaluator'];
  const customMatches = [...md.matchAll(/## (\S+.*)\n\n([\s\S]*?)(?=\n##\s|\s*$)/g)];
  parsed.custom = [];
  customMatches.forEach(m=>{
    const title = m[1].trim();
    if(!knownH2.includes(title)){
      parsed.custom.push({title, content: m[2].trim()});
    }
  });

  return parsed;
}

function applyParsed(sk, parsed){
  if(parsed.desc !== undefined) sk.desc = parsed.desc;
  if(parsed.fns !== undefined) sk.fns = parsed.fns;
  if(parsed.guide !== undefined) sk.guide = parsed.guide;
  if(parsed.constraints !== undefined) sk.constraints = parsed.constraints;
  if(parsed.eval !== undefined) sk.eval = parsed.eval;
  if(parsed.custom !== undefined) sk.custom = parsed.custom;
}

function collectVisualEdits(sk){
  const descInput = document.querySelector('.sv-input');
  if(descInput) sk.desc = descInput.value;

  const guideArea = document.querySelector('.sv-section .skill-editor');
  if(guideArea) sk.guide = guideArea.value;

  const csItems = document.querySelectorAll('#csList .sv-list-input');
  if(csItems.length) sk.constraints = [...csItems].map(i=>i.value).filter(v=>v.trim());

  const evItems = document.querySelectorAll('#evList .sv-list-input');
  if(evItems.length) sk.eval = [...evItems].map(i=>i.value).filter(v=>v.trim());

  document.querySelectorAll('.sv-custom').forEach((el,i)=>{
    if(!sk.custom) sk.custom = [];
    if(sk.custom[i]){
      const titleEl = el.querySelector('.sv-custom-title');
      if(titleEl) sk.custom[i].title = titleEl.value;
      const bodyEl = el.querySelector('.skill-editor');
      if(bodyEl) sk.custom[i].content = bodyEl.value;
    }
  });
}

function saveSkill(){
  if(curType!=='skill') return;
  const sk = SKILLS.find(s=>s.id===curId);
  if(!sk) return;

  if(curTab==='code'){
    const ta = document.querySelector('.skill-editor');
    const mdText = ta ? ta.value : null;
    if(!mdText){ toast('无内容'); return; }
    const parsed = parseMd(mdText);
    const tempSk = Object.assign({}, sk, parsed);
    const issues = validateSkill(tempSk);

    if(parsed._dropped && parsed._dropped.length > 0){
      parsed._dropped.forEach(d=>{
        issues.push({type:'warn', msg:`[${d.section}] 格式不符已忽略: "${d.line}"`});
      });
    }

    if(issues.some(i=>i.type==='err')){
      validState = {issues, saved:true};
      renderMdValidBar();
      toast('校验未通过，修复后再试');
      return;
    }
    applyParsed(sk, parsed);
    validState = {issues, saved:true};
    mdDirty = false;
    pendingMdText = null;

    // round-trip: re-render textarea from saved data
    if(ta) ta.value = buildSkillMd(sk);
    renderMdValidBar();

    if(issues.length > 0){
      toast('已保存，部分内容格式不符被忽略');
    } else {
      toast('已保存（Demo 模式）');
    }
  } else {
    collectVisualEdits(sk);
    const issues = validateSkill(sk);
    if(issues.some(i=>i.type==='err')){
      validState = {issues, saved:true};
      renderMain();
      toast('校验未通过，修复后再试');
      return;
    }
    validState = {issues, saved:true};
    renderMain();
    toast('已保存（Demo 模式）');
  }
}

function renderMdValidBar(){
  const slot = document.getElementById('validBarSlot');
  if(slot) slot.innerHTML = renderValidBar();
}

function renderMain(){
  const body = document.getElementById('mainBody');
  if(curType==='agent') renderAgent(body, AGENTS.find(a=>a.id===curId));
  else if(curType==='skill'){
    if(curTab==='code') renderSkillRaw(body, SKILLS.find(s=>s.id===curId));
    else renderSkillVisual(body, SKILLS.find(s=>s.id===curId));
  }
  else if(curType==='fn') renderFn(body, FUNCTIONS.find(f=>f.id===curId));
}

/* ── Agent detail ── */

  const skills = SKILLS.filter(s=>s.agent===a.id);

  // Format system prompt with basic markdown-style highlighting
  const fmtPrompt = a.systemPrompt
    .replace(/^## (.+)$/gm, '<span class="h2">## $1</span>')
    .replace(/「([^」]+)」/g, '<span class="hl">「$1」</span>');

  body.innerHTML = `
    <div class="md-h1">${AGENT_ICONS[a.id]} <span style="color:${agent_color}">${a.name}</span>
      <span class="md-badge" style="background:rgba(255,255,255,.04);color:var(--t3);border:1px solid var(--border);font-size:9px;">${a.role}</span>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <span style="font-size:10.5px;color:${a.active?'var(--green)':'var(--t4)'};">${a.active?'运行中':'待机'}</span>
        <div class="toggle ${a.active?'on':''}" onclick="toggleAgent('${a.id}')"></div>
      </div>
    </div>
    <div class="md-sep"></div>

    <div class="md-h2">System Prompt</div>
    <div class="prompt-area" contenteditable="true" spellcheck="false">${fmtPrompt}</div>

    <div class="md-h2">记忆策略</div>
    <div class="memory-tag">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="3" width="10" height="9" rx="1.5" stroke="currentColor" stroke-width="1.1"/><path d="M4 3V2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.1"/><line x1="2" y1="6.5" x2="12" y2="6.5" stroke="currentColor" stroke-width="1"/></svg>
      ${a.memory}
    </div>

    <div class="md-h2">Skills（${skills.length}）</div>
    <div class="skill-list">
      ${skills.map(s=>`
      <div class="skill-row-card">
        <div class="skill-row-top" onclick="selectItem('skill','${s.id}')">
          <span class="skill-row-name">${s.id}</span>
          <span class="skill-row-desc">${s.desc}</span>
          <span class="skill-row-link">查看 →</span>
        </div>
        <div class="skill-row-fns">
          ${s.fns.map(fid=>{
            const fn = FUNCTIONS.find(x=>x.id===fid);
            return `<span class="skill-fn-tag" onclick="selectItem('fn','${fid}')">${fid}<span class="skill-fn-perm perm-${fn?fn.perm:'auto'}">${fn?fn.perm:''}</span></span>`;
          }).join('')}
        </div>
      </div>`).join('')}
    </div>

    <div class="md-h2">可调用的 Functions（${a.fns.length}）</div>
    <div class="fn-chips">
      ${a.fns.map(fid=>{
        const f = FUNCTIONS.find(x=>x.id===fid);
        return `<span class="fn-chip perm-s perm-${f?f.perm:'auto'}" style="border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);" onclick="selectItem('fn','${fid}')">${fid} <span style="opacity:.5;font-size:9px;">${f?f.perm:''}</span></span>`;
      }).join('')}
    </div>
  `;
}

function toggleAgent(id){
  const a = AGENTS.find(x=>x.id===id);
  a.active = !a.active;
  buildSidebar();
  selectItem('agent',id);
}

/* ── Skill detail — helpers ── */
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function skillHeader(sk){
  const owner = AGENTS.find(a=>a.id===sk.agent);
  const agent_color = {analyst:'var(--blue)',quant:'var(--purple)',risk:'var(--red)',sentinel:'var(--cyan)',coordinator:'var(--green)'}[sk.agent];
  return `
    <div class="sk-detail-header">
      <div class="sk-detail-left">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" style="color:var(--t3);flex-shrink:0;"><rect x="1" y="1" width="13" height="13" rx="2.5" stroke="currentColor" stroke-width="1.2"/><line x1="4" y1="7.5" x2="11" y2="7.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><line x1="4" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><line x1="4" y1="10" x2="8" y2="10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
        <span style="font-family:var(--mono);font-size:15px;font-weight:700;">${sk.id}</span>
      </div>
      <div class="sk-detail-owner" onclick="selectItem('agent','${sk.agent}')">
        <span style="color:${agent_color};display:flex;align-items:center;">${AGENT_ICONS[sk.agent]}</span>
        <span>${owner.name}</span>
      </div>
    </div>
    <div class="md-sep"></div>`;
}

function buildSkillMd(sk){
  const f = FUNCTIONS;
  let md = `---\nname: ${sk.id}\ndescription: >-\n  ${sk.desc}\n---\n\n`;
  md += `# ${sk.id}\n\n`;
  md += `${sk.desc}\n\n`;
  md += `## Tools\n\n`;
  sk.fns.forEach(fid=>{
    const fn = f.find(x=>x.id===fid);
    md += `- \`${fid}\` — ${fn?fn.desc:'(未注册)'}\n`;
  });
  md += `\n## Instructions\n\n${sk.guide}\n`;
  md += `\n## Constraints\n\n`;
  sk.constraints.forEach(c=>{ md += `- ${c}\n`; });
  md += `\n## Evaluator\n\n`;
  sk.eval.forEach(e=>{ md += `- ${e}\n`; });
  if(sk.custom && sk.custom.length > 0){
    sk.custom.forEach(c=>{
      md += `\n## ${c.title}\n\n${c.content}\n`;
    });
  }
  return md;
}

/* ── Skill: 可视化 view ── */
function renderSkillVisual(body, sk){
  const knownFnIds = FUNCTIONS.map(f=>f.id);

  let customHtml = '';
  if(sk.custom && sk.custom.length > 0){
    customHtml = sk.custom.map((c,i)=>`
      <div class="sv-custom">
        <div class="sv-custom-head">
          <span style="color:var(--t4);font-size:10.5px;font-family:var(--mono);">##</span>
          <input class="sv-custom-title" value="${c.title}" spellcheck="false" oninput="updateCustomTitle(${i},this.value)"/>
          <span class="sv-custom-badge">自定义</span>
          <button class="sv-custom-rm" onclick="removeCustom(${i})">×</button>
        </div>
        <textarea class="skill-editor" spellcheck="false" style="min-height:60px;margin:0;">${c.content}</textarea>
      </div>`).join('');
  }

  body.innerHTML = `<div id="validBarSlot">${renderValidBar()}</div>` + skillHeader(sk) + `
    <div class="sv-section">
      <div class="sv-label">描述</div>
      <input class="sv-input" value="${sk.desc}" spellcheck="false"/>
    </div>

    <div class="sv-section">
      <div class="sv-label">Tools</div>
      <div class="sv-tools">
        ${sk.fns.map(fid=>{
          const fn = FUNCTIONS.find(x=>x.id===fid);
          const missing = !knownFnIds.includes(fid);
          return `<div class="sv-tool-row" ${missing?'style="border-color:rgba(239,83,80,.3);"':''}>
            <span class="sv-tool-name${missing?' sv-tool-missing':''}" ${!missing?`onclick="selectItem('fn','${fid}')"`:''}">${fid}</span>
            <span class="sv-tool-desc">${fn?fn.desc:missing?'⚠ 未注册':''}</span>
            ${fn?`<span class="perm-s perm-${fn.perm}">${fn.perm}</span>`:''}
            <button class="sv-tool-rm" title="移除">×</button>
          </div>`;
        }).join('')}
        <button class="sv-add-tool">+ 添加 Function</button>
      </div>
    </div>

    <div class="sv-section">
      <div class="sv-label">指引</div>
      <textarea class="skill-editor" spellcheck="false" style="min-height:120px;">${sk.guide}</textarea>
    </div>

    <div class="sv-section">
      <div class="sv-label">Constraints</div>
      <div class="sv-list" id="csList">
        ${sk.constraints.map((c,i)=>`
        <div class="sv-list-item">
          <span class="sv-list-bullet" style="color:var(--red);">•</span>
          <input class="sv-list-input" value="${c}" spellcheck="false"/>
          <button class="sv-list-rm" title="删除">×</button>
        </div>`).join('')}
      </div>
      <button class="sv-add-item" onclick="addListItem('csList')">+ 添加约束</button>
    </div>

    <div class="sv-section">
      <div class="sv-label">Evaluator</div>
      <div class="sv-list" id="evList">
        ${sk.eval.map((e,i)=>`
        <div class="sv-list-item">
          <span class="sv-list-bullet" style="color:var(--green);">✓</span>
          <input class="sv-list-input" value="${e}" spellcheck="false"/>
          <button class="sv-list-rm" title="删除">×</button>
        </div>`).join('')}
      </div>
      <button class="sv-add-item" onclick="addListItem('evList')">+ 添加标准</button>
    </div>

    ${customHtml}
    <button class="sv-add-item" onclick="addCustomSection()" style="margin-top:6px;">+ 添加自定义模块</button>
  `;
}

function removeCustom(idx){
  const sk = SKILLS.find(s=>s.id===curId);
  if(sk && sk.custom){ sk.custom.splice(idx,1); renderMain(); }
}

function updateCustomTitle(idx, val){
  const sk = SKILLS.find(s=>s.id===curId);
  if(sk && sk.custom && sk.custom[idx]) sk.custom[idx].title = val;
}

function addCustomSection(){
  const sk = SKILLS.find(s=>s.id===curId);
  if(!sk) return;
  if(!sk.custom) sk.custom=[];
  sk.custom.push({title:'Untitled', content:''});
  renderMain();
}

function addListItem(listId){
  const list = document.getElementById(listId);
  const div = document.createElement('div');
  div.className = 'sv-list-item';
  div.innerHTML = `<span class="sv-list-bullet" style="color:${listId==='csList'?'var(--red)':'var(--green)'};">${listId==='csList'?'•':'✓'}</span><input class="sv-list-input" placeholder="新条目…" spellcheck="false"/><button class="sv-list-rm" onclick="this.parentElement.remove()">×</button>`;
  list.appendChild(div);
  div.querySelector('input').focus();
}

function addWfStep(){
  toast('添加步骤（Demo 模式）');
}

function renderStepNode(s, isLast){
  const fnSvg = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2.5 1.5C1.5 3 1.5 7 2.5 8.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><path d="M7.5 1.5C8.5 3 8.5 7 7.5 8.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><line x1="3.8" y1="5" x2="6.2" y2="5" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/></svg>`;
  return `<div class="sv-wf-node">
    <input class="sv-wf-input" value="${s.step}" spellcheck="false"/>
    <div class="sv-wf-meta">
      ${s.fn
        ? `<span class="sv-wf-fn" onclick="selectItem('fn','${s.fn}')">${fnSvg} ${s.fn}</span>`
        : `<span class="sv-wf-llm">LLM</span>`}
      ${s.note ? `<span class="sv-wf-note">${s.note}</span>` : ''}
    </div>
  </div>`;
}

function renderWorkflow(wf){
  let html = '';
  let stepNum = 1;
  wf.forEach((item, idx) => {
    const isLast = idx === wf.length - 1;
    if(item.type === 'step'){
      html += `<div class="wf-row">
        <div class="wf-gutter"><span class="sv-wf-num">${stepNum}</span><div class="wf-vline${isLast?' last':''}"></div></div>
        <div class="wf-content">${renderStepNode(item)}</div>
      </div>`;
      stepNum++;
    } else if(item.type === 'parallel'){
      html += `<div class="wf-row wf-parallel-row">
        <div class="wf-gutter"><span class="wf-par-badge">并行</span><div class="wf-vline${isLast?' last':''}"></div></div>
        <div class="wf-content">
          <div class="wf-par-container">
            ${item.branches.map((branch, bi) => `
            <div class="wf-branch">
              <div class="wf-branch-head">分支 ${bi+1}</div>
              ${branch.map((s, si) => `
              <div class="wf-branch-step">
                <div class="wf-branch-gutter">
                  <span class="wf-branch-dot"></span>
                  ${si < branch.length - 1 ? '<div class="wf-branch-line"></div>' : ''}
                </div>
                ${renderStepNode(s)}
              </div>`).join('')}
            </div>`).join('')}
          </div>
        </div>
      </div>`;
      stepNum++;
    }
  });
  return html;
}

/* ── Skill: SKILL.md raw view ── */
function renderSkillRaw(body, sk){
  const mdContent = buildSkillMd(sk);
  mdDirty = false;
  body.innerHTML = `<div id="validBarSlot">${renderValidBar()}</div>` + skillHeader(sk) + `
    <div class="sk-editor-bar">
      <span class="sk-editor-label">SKILL.md</span>
      <span class="sk-editor-hint">编辑后点「保存更改」或切回「可视化」自动同步</span>
    </div>
    <textarea class="skill-editor" spellcheck="false" oninput="onMdEdit(this)">${mdContent}</textarea>
  `;
}

/* ── Function detail ── */
function renderFn(body, f){
  if(curTab==='code'){
    const schema = {
      name: f.id,
      description: f.desc,
      parameters:{
        type:"object",
        properties: Object.fromEntries(f.params.map(p=>[p.name,{type:p.type,description:p.desc}])),
        required: f.params.filter(p=>p.req).map(p=>p.name)
      }
    };
    body.innerHTML = `
      <div class="md-h1" style="font-family:var(--mono);font-size:14px;">${f.id}</div>
      <div class="md-meta">OpenAI Function Calling 格式 Schema</div>
      <div class="md-sep"></div>
      <pre class="code-block">${JSON.stringify(schema,null,2)}</pre>
      <div style="font-size:11px;color:var(--t3);">此 Schema 在调用 LLM 时作为 <code style="font-family:var(--mono);color:var(--blue);">tools</code> 参数传入。</div>
    `;
    return;
  }

  const permClass = f.perm==='auto'?'perm-auto':f.perm==='ask'?'perm-ask':'perm-deny';
  const ownerAgents = AGENTS.filter(a=>f.agents.includes(a.id));
  const agent_colors = {analyst:'var(--blue)',quant:'var(--purple)',risk:'var(--red)',sentinel:'var(--cyan)',coordinator:'var(--green)'};

  body.innerHTML = `
    <div class="fn-header">
      <div class="fn-name">${f.id}</div>
      <div class="fn-desc">${f.desc}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
        <span style="font-size:10px;color:var(--t3);">分类：</span>
        <span style="font-size:10.5px;color:var(--t2);">${f.cat}</span>
        <span style="color:var(--t4);">·</span>
        <span style="font-size:10px;color:var(--t3);">权限：</span>
        <span class="perm-s ${permClass}">${f.perm}</span>
      </div>
    </div>
    <div class="md-sep"></div>

    <div class="md-h2">权限设置</div>
    <div class="perm-sel" style="margin-bottom:14px;">
      <button class="perm-opt ${f.perm==='auto'?'sel-auto':''}" onclick="changePerm('${f.id}','auto',this)">auto — 自动执行</button>
      <button class="perm-opt ${f.perm==='ask'?'sel-ask':''}" onclick="changePerm('${f.id}','ask',this)">ask — 每次确认</button>
      <button class="perm-opt ${f.perm==='deny'?'sel-deny':''}" onclick="changePerm('${f.id}','deny',this)">deny — 禁止调用</button>
    </div>

    <div class="md-h2">参数（${f.params.length}）</div>
    ${f.params.length>0?`
    <table class="params-table" style="margin-bottom:14px;">
      <tr><th>参数名</th><th>类型</th><th>必填</th><th>描述</th></tr>
      ${f.params.map(p=>`
      <tr>
        <td class="param-name">${p.name}</td>
        <td class="param-type">${p.type}</td>
        <td><span class="${p.req?'param-req':'param-opt'}">${p.req?'必填':'可选'}</span></td>
        <td style="color:var(--t3);font-size:11px;">${p.desc}</td>
      </tr>`).join('')}
    </table>` : `<div style="font-size:11.5px;color:var(--t3);margin-bottom:14px;">无参数</div>`}

    <div class="md-h2">绑定的 Agents（${ownerAgents.length}）</div>
    <div class="agent-tags" style="margin-bottom:14px;">
      ${ownerAgents.length>0 ? ownerAgents.map(a=>`
        <div class="agent-tag" onclick="selectItem('agent','${a.id}')" style="cursor:pointer;" title="查看 ${a.name}">
          <span style="color:${agent_colors[a.id]}">${AGENT_ICONS[a.id]}</span>${a.name}
        </div>`).join('') : `<span style="font-size:11px;color:var(--t4);">未绑定任何 Agent（系统级保留）</span>`}
    </div>
  `;
}

function changePerm(fid, newPerm, btn){
  const f = FUNCTIONS.find(x=>x.id===fid);
  f.perm = newPerm;
  // Update sidebar badge
  const sRow = document.getElementById('fr-'+fid);
  if(sRow){
    const badge = sRow.querySelector('.perm-s');
    badge.className = `perm-s perm-${newPerm}`;
    badge.textContent = newPerm;
  }
  // Re-render
  renderMain();
}

/* ══════════ Collapse ══════════ */
function toggleSec(id){
  document.getElementById(id).classList.toggle('collapsed');
}

function switchRail(btn){
  document.querySelectorAll('.rail-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

/* ══════════ Register Modal ══════════ */
let regPerm = 'auto';
function openRegister(){ document.getElementById('regOverlay').classList.add('show'); }
function closeRegister(){ document.getElementById('regOverlay').classList.remove('show'); }
function closeIfBg(e){ if(e.target===document.getElementById('regOverlay')) closeRegister(); }
function pickPerm(el, p){
  regPerm=p;
  document.querySelectorAll('.perm-pill').forEach(x=>{x.className='perm-pill';});
  el.classList.add('active-'+p);
}
function confirmRegister(){
  const name = document.getElementById('regName').value.trim();
  if(!name){ document.getElementById('regName').focus(); return; }
  closeRegister();
  toast(`Function "${name}" 已注册（Demo 模式）`);
}
function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1a2332;border:1px solid rgba(60,200,122,.3);color:#3cc87a;padding:8px 18px;border-radius:8px;font-size:12px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap;';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400);},2000);
}

/* ══════════ Init ══════════ */
buildSidebar();
selectItem('agent','analyst');
</script>
