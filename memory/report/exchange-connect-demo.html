<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Exchange Connect Demo — 单选 B 分栏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a1420;--bg2:#0c1520;--bg3:#080f1a;
  --border:#182030;--border2:#1e2d40;--border3:#243448;
  --text:#c2cee0;--text2:#8a9ab0;--text3:#5a7088;--text4:#3a5068;
  --g:#3cc87a;--g-bg:rgba(60,200,122,.1);--g-bd:rgba(60,200,122,.3);
  --r:#e05050;--r-bg:rgba(220,60,60,.06);--r-bd:rgba(220,60,60,.22);
  --blue:#5b8def;
}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}

/* ── TitleBar ── */
.titlebar{
  height:38px;display:flex;align-items:center;flex-shrink:0;
  background:#090d16;border-bottom:1px solid var(--border);
  padding:0 12px;user-select:none;
}
.tb-traffic{width:72px;flex-shrink:0;display:flex;gap:6px;align-items:center;}
.tb-dot{width:12px;height:12px;border-radius:50%;}
.tb-dot.r{background:#ff5f57;} .tb-dot.y{background:#ffbd2e;} .tb-dot.g{background:#28c840;}
.tb-name{flex:1;text-align:center;font-size:12px;font-weight:600;letter-spacing:.3px;color:#6a7a90;}

/* ── Shell ── */
.shell{flex:1;display:flex;overflow:hidden;}

/* ── Nav ── */
.nav{
  width:210px;flex-shrink:0;background:var(--bg2);
  border-right:1px solid var(--border);padding:14px 0;overflow-y:auto;
}
.nav-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 12px;font-size:13px;font-weight:600;color:var(--text);
  border-bottom:1px solid var(--border);margin-bottom:8px;
}
.nav-close{
  width:22px;height:22px;border:none;border-radius:4px;
  background:transparent;color:var(--text3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .12s;
}
.nav-close:hover{color:var(--text);background:rgba(255,255,255,.06);}
.nav-section{font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:#3a5068;padding:10px 16px 4px;}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 16px;
  cursor:pointer;font-size:12px;color:var(--text3);position:relative;transition:all .1s;
}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.04);}
.nav-item.active{color:var(--text);background:rgba(255,255,255,.06);}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;border-radius:0 1px 1px 0;background:var(--g);}
.nav-item svg{width:14px;height:14px;flex-shrink:0;opacity:.65;}
.nav-item.active svg{opacity:1;}
.nav-div{height:1px;background:var(--border);margin:6px 0;}

/* ── Content ── */
.content{flex:1;overflow-y:auto;background:var(--bg);padding:28px 36px;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.s-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:22px;letter-spacing:-.2px;}
.g-label{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin:22px 0 10px;}
.g-label:first-of-type{margin-top:0;}

/* ══ Exchange Panel — 方案 B 左右分栏 ══ */
.ex-panel{
  display:flex;border:1px solid var(--border);border-radius:10px;
  overflow:hidden;min-height:340px;
}

/* 左侧列表 */
.ex-list{
  width:168px;flex-shrink:0;
  border-right:1px solid var(--border);background:var(--bg2);
}
.ex-item{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px;cursor:pointer;
  border-bottom:1px solid #121e2c;
  position:relative;transition:background .1s;
}
.ex-item:last-child{border-bottom:none;}
.ex-item:hover{background:rgba(255,255,255,.03);}
.ex-item.active{background:rgba(255,255,255,.05);}
.ex-item.active::before{content:'';position:absolute;left:0;top:16%;bottom:16%;width:2px;border-radius:0 1px 1px 0;background:var(--g);}
.ex-logo{
  width:30px;height:30px;border-radius:7px;border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;
}
.ex-logo img{width:20px;height:20px;object-fit:contain;}
.ex-item-info{flex:1;min-width:0;}
.ex-item-name{font-size:12px;font-weight:600;color:var(--text);}
.ex-item-sub{font-size:10px;color:var(--text3);margin-top:2px;}
.ex-item-sub.on{color:var(--g);}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.status-dot.on{background:var(--g);box-shadow:0 0 5px rgba(60,200,122,.5);}
.status-dot.off{background:#2a3d52;}

/* 右侧详情 */
.ex-detail{flex:1;padding:22px 24px;overflow-y:auto;}
.ex-detail::-webkit-scrollbar{width:3px;}
.ex-detail::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* 详情头部 */
.ex-dh{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.ex-dh-logo{width:38px;height:38px;border-radius:9px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.ex-dh-logo img{width:24px;height:24px;object-fit:contain;}
.ex-dh-info{flex:1;}
.ex-dh-name{font-size:15px;font-weight:600;color:var(--text);}
.ex-dh-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.ex-dh-sub .on{color:var(--g);}
.ex-dh-acts{display:flex;gap:8px;flex-shrink:0;}

/* buttons */
.btn{
  height:28px;padding:0 14px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;
  border:1px solid #2a3d52;background:rgba(255,255,255,.04);color:var(--text2);transition:all .12s;
}
.btn:hover{color:var(--text);border-color:#3a5068;background:rgba(255,255,255,.08);}
.btn-sm{height:26px;padding:0 10px;font-size:10px;}
.btn-primary{background:var(--g-bg);color:var(--g);border-color:var(--g-bd);min-width:88px;height:36px;font-size:12px;font-weight:500;}
.btn-primary:hover{background:rgba(60,200,122,.18);}
.btn-red{color:var(--r);border-color:var(--r-bd);background:var(--r-bg);}
.btn-red:hover{background:rgba(220,60,60,.12);}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none;}

/* form */
.f-row{margin-bottom:12px;}
.f-label{font-size:10px;color:var(--text3);margin-bottom:5px;display:block;letter-spacing:.2px;}
.f-input{
  width:100%;height:38px;padding:0 14px;border-radius:8px;
  border:1px solid var(--border3);background:var(--bg3);color:var(--text);
  font-size:12px;outline:none;transition:border-color .12s;
}
.f-input::placeholder{color:var(--text4);}
.f-input:focus{border-color:rgba(91,141,239,.5);}
.f-footer{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.f-link{font-size:11px;color:var(--text3);}
.f-link a{color:var(--blue);text-decoration:none;}
.f-link a:hover{text-decoration:underline;}

/* balance */
.bal-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;}
.bal-tab{
  padding:8px 16px;font-size:11px;font-weight:500;cursor:pointer;
  color:#5a7290;border-bottom:2px solid transparent;transition:all .12s;user-select:none;
}
.bal-tab:hover{color:#a0b4cc;}
.bal-tab.active{color:#e3ebf8;border-bottom-color:var(--g);}
.bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.bal-cell{padding:11px 13px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.015);}
.bal-cell .k{font-size:10px;color:var(--text3);margin-bottom:3px;}
.bal-cell .v{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.3px;}
.bal-cell .v.green{color:var(--g);}
.asset-table{width:100%;border-collapse:collapse;}
.asset-table th{font-size:10px;color:var(--text4);text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);font-weight:500;letter-spacing:.3px;}
.asset-table td{font-size:12px;color:var(--text);padding:8px;border-bottom:1px solid #0e1a28;}
.asset-table tr:last-child td{border-bottom:none;}
.asset-table .num{text-align:right;font-variant-numeric:tabular-nums;}
.asset-table .muted{color:var(--text3);}

/* settings rows */
.s-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:4px;}
.s-row{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid #121e2c;transition:background .1s;}
.s-row:last-child{border-bottom:none;}
.s-row:hover{background:rgba(255,255,255,.02);}
.s-row-info{flex:1;}
.s-row-title{font-size:13px;color:var(--text);font-weight:500;}
.s-row-desc{font-size:11px;color:var(--text3);margin-top:2px;}
.sel{height:28px;padding:0 10px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid #2a3d52;background:var(--bg2);color:var(--text2);outline:none;}
.toggle{width:34px;height:18px;border-radius:9px;background:var(--border2);border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:var(--text3);top:2px;left:2px;transition:all .2s;}
.toggle.on{background:rgba(60,200,122,.35);}
.toggle.on::after{background:var(--g);left:18px;}

/* ── 确认弹窗 ── */
.overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(4,10,20,.7);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;
}
.overlay.show{display:flex;}
.modal{
  background:#0e1928;border:1px solid #243448;border-radius:12px;
  padding:24px 26px;width:340px;box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.modal-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;}
.modal-body{font-size:12px;color:var(--text3);line-height:1.65;margin-bottom:20px;}
.modal-body strong{color:#d0a84a;}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;}
.modal-cancel{height:34px;padding:0 16px;border-radius:7px;font-size:12px;cursor:pointer;border:1px solid #2a3d52;background:transparent;color:var(--text2);transition:all .12s;}
.modal-cancel:hover{color:var(--text);border-color:#3a5068;}
.modal-confirm{height:34px;padding:0 18px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:rgba(220,100,60,.15);color:#e08060;border:1px solid rgba(220,100,60,.3);transition:all .12s;}
.modal-confirm:hover{background:rgba(220,100,60,.25);}

/* spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid rgba(60,200,122,.2);border-top-color:var(--g);border-radius:50%;animation:spin .55s linear infinite;vertical-align:middle;margin-right:5px;}
</style>
</head>

<script>
/* ── 数据 ── */
var logos = {

  bitget:  'https://www.bitget.com/zh-CN/account/newapi',
  okx:     'https://www.okx.com/account/my-api',
  binance: 'https://www.binance.com/zh-CN/my/settings/api-management',
};
// 模拟状态：activeId = 已连接的交易所
var state = {
  activeId: 'bitget',
  maskedKey: {bitget:'bg_e••••••••cf89', okx:null, binance:null},
  balances: {
    bitget: {
      spot:  {total:16.80, avail:16.80, assets:[{c:'USDT',f:16.80,l:0},{c:'BGB',f:2.14,l:0}]},
      swap:  {equity:238.50, avail:180.20, upnl:12.35, used:58.30,
              pos:[{sym:'BTCUSDT',dir:'多',qty:0.02,pnl:8.60},{sym:'ETHUSDT',dir:'空',qty:1.5,pnl:3.75}]},
    },
  },
};
var currentId = 'bitget';
var pendingId = null;
var currentBalTab = {};  // per exchange

/* ── 渲染 ── */
function renderDetail(id) {
  var el = document.getElementById('exDetail');
  if (state.activeId === id) {
    el.innerHTML = renderConnected(id);
  } else {
    el.innerHTML = renderForm(id);
  }
}

function renderConnected(id) {
  var bal = state.balances[id] || {};
  var tab = currentBalTab[id] || 'spot';
  return `
    <div class="ex-dh">
      <div class="ex-dh-logo"><img src="${logos[id]}" alt="${names[id]}"/></div>
      <div class="ex-dh-info">
        <div class="ex-dh-name">${names[id]}</div>
        <div class="ex-dh-sub"><span class="on">已连接</span> · ${state.maskedKey[id] || ''}</div>
      </div>
      <div class="ex-dh-acts">
        <button class="btn btn-sm" onclick="mockTest('${id}')">测试</button>
        <button class="btn btn-sm btn-red" onclick="mockDisconnect('${id}')">断开</button>
      </div>
    </div>
    <div class="bal-tabs">
      <div class="bal-tab ${tab==='spot'?'active':''}" onclick="switchBalTab('${id}','spot',this)">现货</div>
      <div class="bal-tab ${tab==='swap'?'active':''}" onclick="switchBalTab('${id}','swap',this)">合约</div>
    </div>
    <div id="bal-content">${tab==='spot' ? renderSpot(bal.spot) : renderSwap(bal.swap)}</div>
  `;
}

function renderSpot(s) {
  if (!s) return '<div style="color:var(--text3);font-size:12px;padding:12px 0">暂无现货数据</div>';
  var rows = (s.assets||[]).map(a =>
    `<tr><td>${a.c}</td><td class="num">${a.f.toFixed(2)}</td><td class="num muted">${a.l.toFixed(2)}</td></tr>`
  ).join('');
  return `
    <div class="bal-grid">
      <div class="bal-cell"><div class="k">总余额</div><div class="v">$${s.total.toFixed(2)}</div></div>
      <div class="bal-cell"><div class="k">可用</div><div class="v green">$${s.avail.toFixed(2)}</div></div>
    </div>
    <table class="asset-table"><thead><tr><th>币种</th><th class="num">可用</th><th class="num">冻结</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderSwap(s) {
  if (!s) return '<div style="color:var(--text3);font-size:12px;padding:12px 0">暂无合约数据</div>';
  var sign = s.upnl >= 0 ? '+' : '';
  var col = s.upnl >= 0 ? 'var(--g)' : 'var(--r)';
  var rows = (s.pos||[]).map(p => {
    var dc = p.dir==='多'?'var(--g)':'var(--r)';
    var pc = p.pnl>=0?'var(--g)':'var(--r)';
    return `<tr><td>${p.sym}</td><td class="num" style="color:${dc}">${p.dir}</td><td class="num">${p.qty}</td><td class="num" style="color:${pc}">${p.pnl>=0?'+':''}$${p.pnl.toFixed(2)}</td></tr>`;
  }).join('');
  return `
    <div class="bal-grid">
      <div class="bal-cell"><div class="k">账户权益</div><div class="v">$${s.equity.toFixed(2)}</div></div>
      <div class="bal-cell"><div class="k">可用保证金</div><div class="v green">$${s.avail.toFixed(2)}</div></div>
      <div class="bal-cell"><div class="k">未实现盈亏</div><div class="v" style="color:${col}">${sign}$${Math.abs(s.upnl).toFixed(2)}</div></div>
      <div class="bal-cell"><div class="k">已用保证金</div><div class="v">$${s.used.toFixed(2)}</div></div>
    </div>
    <table class="asset-table"><thead><tr><th>合约</th><th class="num">方向</th><th class="num">数量</th><th class="num">盈亏</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderForm(id) {
  var passField = needsPass[id] ? `
    <div class="f-row">
      <label class="f-label">Passphrase</label>
      <input class="f-input" type="password" id="f-pass-${id}" placeholder="创建 API 时设置的口令" autocomplete="off"/>
    </div>` : '';
  return `
    <div class="ex-dh">
      <div class="ex-dh-logo"><img src="${logos[id]}" alt="${names[id]}"/></div>
      <div class="ex-dh-info">
        <div class="ex-dh-name">${names[id]}</div>
        <div class="ex-dh-sub">未连接</div>
      </div>
    </div>
    <div class="f-row"><label class="f-label">API Key</label><input class="f-input" type="password" id="f-key-${id}" placeholder="粘贴你的 API Key" autocomplete="off"/></div>
    <div class="f-row"><label class="f-label">Secret Key</label><input class="f-input" type="password" id="f-secret-${id}" placeholder="粘贴你的 Secret Key" autocomplete="off"/></div>
    ${passField}
    <div class="f-footer">
      <button class="btn btn-primary" id="connect-btn-${id}" onclick="handleConnect('${id}')">连接</button>
      <span class="f-link"><a href="${apiLink[id]}" target="_blank">获取 API Key →</a></span>
    </div>
  `;
}

/* ── 切换左侧选中 ── */
function selectExchange(id, el) {
  if (id === currentId) return;
  currentId = id;
  document.querySelectorAll('.ex-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  renderDetail(id);
}

function switchBalTab(id, tab, el) {
  currentBalTab[id] = tab;
  el.parentElement.querySelectorAll('.bal-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('bal-content').innerHTML =
    tab === 'spot' ? renderSpot(state.balances[id]?.spot) : renderSwap(state.balances[id]?.swap);
}

/* ── 连接逻辑（含单选互斥确认） ── */
function handleConnect(id) {
  if (state.activeId && state.activeId !== id) {
    // 有旧连接 → 弹确认
    pendingId = id;
    document.getElementById('switchModalBody').innerHTML =
      `当前已连接 <strong>${names[state.activeId]}</strong>，连接新交易所将自动断开。<br/>确认切换到 <strong style="color:var(--text)">${names[id]}</strong> 吗？`;
    document.getElementById('switchOverlay').classList.add('show');
  } else {
    doConnect(id);
  }
}

function cancelSwitch() {
  document.getElementById('switchOverlay').classList.remove('show');
  pendingId = null;
}

function confirmSwitch() {
  document.getElementById('switchOverlay').classList.remove('show');
  if (pendingId) doConnect(pendingId);
  pendingId = null;
}

function doConnect(id) {
  var btn = document.getElementById('connect-btn-' + id);
  if (btn) { btn.innerHTML = '<span class="spinner"></span>连接中…'; btn.disabled = true; }
  setTimeout(function() {
    // 断开旧的
    if (state.activeId) {
      var old = state.activeId;
      state.maskedKey[old] = null;
      document.getElementById('dot-' + old).className = 'status-dot off';
      document.getElementById('sub-list-' + old).textContent = '未连接';
      document.getElementById('sub-list-' + old).className = 'ex-item-sub';
    }
    // 连接新的
    state.activeId = id;
    state.maskedKey[id] = id.substring(0,2) + '_k••••••••ef' + id.charCodeAt(0) % 10 + id.charCodeAt(1) % 10;
    // mock balance
    state.balances[id] = {
      spot: {total:1024.50, avail:980.00, assets:[{c:'USDT',f:880,l:20},{c:'BTC',f:0.0012,l:0},{c:'ETH',f:0.15,l:0}]},
      swap: {equity:3210.00, avail:2540.00, upnl:86.20, used:670.00,
             pos:[{sym:'BTCUSDT',dir:'多',qty:0.05,pnl:62.40},{sym:'SOLUSDT',dir:'空',qty:10,pnl:23.80}]},
    };
    document.getElementById('dot-' + id).className = 'status-dot on';
    document.getElementById('sub-list-' + id).textContent = '已连接';
    document.getElementById('sub-list-' + id).className = 'ex-item-sub on';
    currentBalTab[id] = 'spot';
    renderDetail(id);
  }, 1200);
}

/* ── 测试 & 断开 ── */
function mockTest(id) {
  var btns = document.querySelectorAll('.btn-sm');
  var testBtn = Array.from(btns).find(b => b.textContent === '测试');
  if (testBtn) { testBtn.innerHTML = '<span class="spinner"></span>'; testBtn.disabled = true; }
  setTimeout(function() {
    if (testBtn) { testBtn.textContent = '✓ 正常'; testBtn.disabled = false; }
    setTimeout(function() { if (testBtn) testBtn.textContent = '测试'; }, 1800);
  }, 700);
}

function mockDisconnect(id) {
  state.activeId = null;
  state.maskedKey[id] = null;
  document.getElementById('dot-' + id).className = 'status-dot off';
  document.getElementById('sub-list-' + id).textContent = '未连接';
  document.getElementById('sub-list-' + id).className = 'ex-item-sub';
  renderDetail(id);
}

/* ── 初始化 ── */
renderDetail('bitget');
</script>
</body>
</html>
