<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursor 手感自动跟随 Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1220;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 980px;
      margin: 0 auto;
      padding: 12px;
      box-sizing: border-box;
      gap: 10px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      border: 1px solid #2a3a52;
      border-radius: 8px;
      background: #122035;
      color: #cfe2ff;
      padding: 6px 10px;
      cursor: pointer;
    }
    .hint {
      font-size: 12px;
      color: #9cb0ce;
    }
    .shell {
      flex: 0 0 auto;
      height: clamp(420px, 56vh, 620px);
      border: 1px solid #294f79;
      border-radius: 12px;
      background: #101a2a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .head {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #20324b;
      color: #cfe2ff;
      font-weight: 600;
    }
    .status {
      font-size: 12px;
      color: #9cb0ce;
      font-weight: 500;
    }
    .messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .messages > * {
      flex: 0 0 auto;
    }
    .bottom-anchor {
      height: 1px;
    }
    .composer {
      flex: 0 0 auto;
      border-top: 1px solid #20324b;
      padding: 10px 12px;
      background: #0f1828;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .composer input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #2a3a52;
      border-radius: 8px;
      padding: 8px 10px;
      background: #0c1422;
      color: #dbe7ff;
      outline: none;
    }
    .row {
      border: 0;
      border-radius: 12px;
      background: #152238;
      padding: 9px 11px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      width: fit-content;
      max-width: min(760px, 86%);
    }
    .row.user {
      margin-left: auto;
      background: #18304f;
    }
    .row.assistant {
      margin-right: auto;
      background: #111d2f;
    }
    .task {
      border: 1px solid #223a58;
      border-radius: 10px;
      background: #0f1828;
      overflow: hidden;
    }
    .task-head {
      padding: 8px 10px;
      border-bottom: 1px solid #20324b;
      color: #d4e5ff;
      font-weight: 600;
    }
    .task-process {
      padding: 8px 12px 10px;
      display: grid;
      gap: 10px;
      border-bottom: 1px solid #20324b;
    }
    .task-result {
      padding: 10px;
      display: none;
      gap: 8px;
    }
    .step {
      border: 0;
      border-left: 2px solid #2d4a70;
      padding-left: 8px;
    }
    .step summary {
      list-style: none;
      cursor: default;
      padding: 2px 0;
      display: flex;
      justify-content: space-between;
      color: #cfdef3;
      font-size: 13px;
      font-weight: 600;
    }
    .step summary::-webkit-details-marker { display: none; }
    .step .body {
      padding: 4px 0 0;
      display: grid;
      gap: 5px;
    }
    .line {
      border: 0;
      border-left: 2px solid #294f79;
      padding: 1px 0 1px 8px;
      font-size: 12px;
      color: #b8cbe5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .result-ok {
      border: 1px solid #2d6e4d;
      border-radius: 8px;
      background: #12281f;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <button id="startBtn" type="button">开始演示</button>
      <button id="resetBtn" type="button">重置</button>
      <span class="hint">只滚动中间消息区，底部输入框固定不被顶走。</span>
    </div>

    <div class="shell">
      <div class="head">
        <span>特征生成任务（过程常驻，不自动收起）</span>
        <span class="status" id="statusText">等待中</span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input value="这里模拟用户输入框（固定在底部）" readonly />
        <button type="button">发送</button>
      </div>
    </div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const statusText = document.getElementById("statusText");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");

    let timer = null;
    let idx = 0;

    const follow = {
      threshold: 64,
      autoFollowEnabled: true,
      pending: false,
      programmaticUntil: 0,
    };

    function setStatus(text) {
      statusText.textContent = text;
    }

    function distanceToBottom() {
      return messages.scrollHeight - messages.clientHeight - messages.scrollTop;
    }

    function isNearBottom() {
      return distanceToBottom() <= follow.threshold;
    }

    function updateFollowStateByScroll() {
      if (Date.now() < follow.programmaticUntil) return;
      follow.autoFollowEnabled = isNearBottom();
      setStatus(follow.autoFollowEnabled ? "自动跟随中" : "手动查看中（已暂停自动跟随）");
    }

    function requestAutoFollow(force) {
      if (!force && !follow.autoFollowEnabled) return;
      if (follow.pending) return;
      follow.pending = true;
      requestAnimationFrame(() => {
        follow.pending = false;
        follow.programmaticUntil = Date.now() + 120;
        const anchor = document.getElementById("bottomAnchor");
        if (anchor) {
          anchor.scrollIntoView({ block: "end", behavior: "auto" });
        } else {
          messages.scrollTo({ top: messages.scrollHeight, behavior: "auto" });
        }
      });
    }

    messages.addEventListener("scroll", updateFollowStateByScroll, { passive: true });

    messages.addEventListener("wheel", (event) => {
      // 用户往上滚就立即暂停，防止“抢滚动控制权”。
      if (event.deltaY < 0) {
        follow.autoFollowEnabled = false;
        setStatus("手动查看中（已暂停自动跟随）");
      }
    }, { passive: true });

    function mkRow(text, cls) {
      const el = document.createElement("div");
      el.className = "row" + (cls ? " " + cls : "");
      el.textContent = text;
      return el;
    }

    function mkTask() {
      const task = document.createElement("div");
      task.className = "task";
      task.innerHTML = ""
        + '<div class="task-head">特征生成任务（执行中保持展开）</div>'
        + '<div class="task-process" data-step-host></div>'
        + '<div class="task-result" id="taskResult"></div>';
      return task;
    }

    const STEP_META = {
      understand: "理解需求",
      plan: "生成计划",
      write: "生成代码",
      run: "运行与检测",
    };

    function createStepNode(stepKey, stateText) {
      const details = document.createElement("details");
      details.className = "step";
      details.open = true;
      details.setAttribute("data-step", stepKey);
      details.innerHTML = ""
        + "<summary>"
        + "<span>" + STEP_META[stepKey] + "</span>"
        + "<span>" + (stateText || "进行中") + "</span>"
        + "</summary>"
        + '<div class="body"></div>';
      return details;
    }

    function ensureStep(task, stepKey, stateText) {
      if (!task) return null;
      let step = task.querySelector('[data-step="' + stepKey + '"]');
      if (step) return step;
      const host = task.querySelector("[data-step-host]");
      if (!host) return null;
      step = createStepNode(stepKey, stateText);
      host.appendChild(step);
      return step;
    }

    function updateStepState(task, stepKey, state) {
      const step = ensureStep(task, stepKey, state || "进行中");
      if (!step) return;
      const stateNode = step.querySelector("summary span:last-child");
      stateNode.textContent = state;
    }

    function appendLine(task, stepKey, text) {
      const step = ensureStep(task, stepKey, "进行中");
      if (!step) return;
      step.open = true;
      const body = step.querySelector(".body");
      const line = document.createElement("div");
      line.className = "line";
      line.textContent = text;
      body.appendChild(line);
    }

    let taskEl = null;
    let thinkingText = "";

    function reset() {
      if (timer) clearInterval(timer);
      timer = null;
      idx = 0;
      follow.autoFollowEnabled = true;
      follow.pending = false;
      follow.programmaticUntil = 0;
      thinkingText = "";
      messages.innerHTML = "";
      messages.appendChild(mkRow("帮我生成一个动量类特征，用于趋势增强。", "user"));
      messages.appendChild(mkRow("收到，我开始做需求理解和计划生成。", "assistant"));
      taskEl = mkTask();
      messages.appendChild(taskEl);
      ensureStep(taskEl, "understand", "进行中");
      const anchor = document.createElement("div");
      anchor.id = "bottomAnchor";
      anchor.className = "bottom-anchor";
      messages.appendChild(anchor);
      setStatus("等待中");
      startBtn.disabled = false;
      requestAutoFollow(true);
    }

    const script = [
      () => appendLine(taskEl, "understand", "已读取用户目标、历史上下文和澄清选项。"),
      () => appendLine(taskEl, "understand", "确认约束：趋势增强、输出连续特征、可解释。"),
      () => appendLine(taskEl, "understand", "补充边界：低波动阶段需降噪与平滑。"),
      () => {
        updateStepState(taskEl, "understand", "已完成");
        ensureStep(taskEl, "plan", "进行中");
      },
      () => { thinkingText += "先收敛目标：提升趋势段信号强度。\n"; appendLine(taskEl, "plan", "AI 思考过程\n" + thinkingText.trim()); },
      () => { thinkingText += "再定路线：RSI + MACD 组合并归一化。\n"; appendLine(taskEl, "plan", "AI 思考过程\n" + thinkingText.trim()); },
      () => { thinkingText += "验证策略：长度、空值、方差、响应速度。\n"; appendLine(taskEl, "plan", "AI 思考过程\n" + thinkingText.trim()); },
      () => appendLine(taskEl, "plan", "本次任务计划\n- 需求\n- 方法\n- 验证\n- 修复"),
      () => {
        updateStepState(taskEl, "plan", "已完成");
        ensureStep(taskEl, "write", "进行中");
      },
      () => appendLine(taskEl, "write", "代码片段流 #1"),
      () => appendLine(taskEl, "write", "代码片段流 #2"),
      () => appendLine(taskEl, "write", "代码片段流 #3"),
      () => appendLine(taskEl, "write", "代码片段流 #4"),
      () => {
        updateStepState(taskEl, "write", "已完成");
        ensureStep(taskEl, "run", "进行中");
      },
      () => appendLine(taskEl, "run", "mock 运行通过，开始真实评估。"),
      () => appendLine(taskEl, "run", "检测通过，准备输出总结。"),
      () => {
        updateStepState(taskEl, "run", "已完成");
        const result = taskEl.querySelector("#taskResult");
        result.style.display = "grid";
        result.innerHTML = ""
          + '<div class="result-ok">'
          + "  <div><b>特征已生成</b></div>"
          + "  <div>总结区常驻可见，可直接继续操作。</div>"
          + '  <button type="button">加入特征库</button>'
          + "</div>";
        messages.appendChild(mkRow("助手：任务完成。你可以直接点“加入特征库”。"));
      },
    ];

    const followObserver = new MutationObserver(() => {
      requestAutoFollow(false);
    });
    followObserver.observe(messages, { childList: true, subtree: true, characterData: true });

    function start() {
      if (timer) return;
      startBtn.disabled = true;
      setStatus("自动跟随中");
      timer = setInterval(() => {
        if (idx >= script.length) {
          clearInterval(timer);
          timer = null;
          setStatus("已完成（过程区保持展示，不收起）");
          startBtn.disabled = false;
          return;
        }
        script[idx]();
        idx += 1;
        requestAutoFollow(false);
      }, 620);
    }

    startBtn.addEventListener("click", start);
    resetBtn.addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
