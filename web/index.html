<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ThunderClaw · 虾脑配置向导</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #121a33;
        --line: #2a365f;
        --text: #edf1ff;
        --muted: #9ca9cd;
        --ok: #4ade80;
        --warn: #facc15;
        --bad: #f87171;
        --accent: #60a5fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #18295c 0%, var(--bg) 46%);
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 14px 48px;
      }
      .card {
        background: linear-gradient(180deg, #172349, var(--panel));
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 19px;
      }
      p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .steps {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }
      .step {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #0d1735;
        font-size: 14px;
      }
      .badge {
        display: inline-block;
        border: 1px solid #4066aa;
        border-radius: 999px;
        padding: 2px 8px;
        margin-right: 6px;
        color: #b8d3ff;
        font-size: 12px;
      }
      .status-banner {
        margin-top: 12px;
        border-radius: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        background: #0d1735;
      }
      .status-banner.ok {
        border-color: #1d6f44;
        color: #c2f9d8;
      }
      .status-banner.warn {
        border-color: #7a6120;
        color: #fbe59d;
      }
      .status-banner.bad {
        border-color: #8a2e2e;
        color: #ffc4c4;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin: 10px 0 6px;
      }
      input,
      select,
      textarea,
      button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #0e1631;
        color: var(--text);
        padding: 10px 12px;
        font-size: 14px;
      }
      button {
        cursor: pointer;
        font-weight: 600;
        background: #17407a;
        border-color: #2f65b4;
      }
      button.secondary {
        background: #1a2344;
        border-color: var(--line);
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      .row {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #chatStream {
        max-height: 320px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #0c1430;
        margin-top: 10px;
      }
      .msg {
        margin-bottom: 9px;
        border-radius: 9px;
        padding: 9px;
        white-space: pre-wrap;
      }
      .msg.user {
        background: #1a2c5f;
      }
      .msg.assistant {
        background: #142640;
      }
      details {
        margin-top: 8px;
      }
      summary {
        cursor: pointer;
        color: #c8d4fa;
      }
      .small {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="card">
        <h1>ThunderClaw · 虾脑配置向导</h1>
        <p class="muted">你不用懂 OpenClaw 配置细节，跟着 3 步走就能直接开始对话。</p>
        <div class="steps">
          <div class="step"><span class="badge">第 1 步</span>粘贴 DeepSeek API Key</div>
          <div class="step"><span class="badge">第 2 步</span>点击“一键完成基础配置”</div>
          <div class="step"><span class="badge">第 3 步</span>在下方输入消息开始聊天</div>
        </div>
        <div id="banner" class="status-banner warn">正在检查当前状态...</div>
      </section>

      <section class="card">
        <h2>推荐：DeepSeek 一键配置（最简单）</h2>
        <label for="quickApiKey">DeepSeek API Key</label>
        <input id="quickApiKey" type="password" placeholder="粘贴 sk-..." autocomplete="off" />
        <div class="row" style="margin-top: 10px">
          <button id="quickSetupBtn" type="button">一键完成基础配置</button>
          <button id="refreshBtn" class="secondary" type="button">刷新状态</button>
        </div>
        <div id="quickOutput" class="mono small" style="margin-top: 10px"></div>

        <details>
          <summary>高级入口（其他 Provider / OAuth）</summary>
          <div style="margin-top: 8px">
            <label for="provider">Provider</label>
            <select id="provider">
              <option value="openai-api-key">OpenAI API Key</option>
              <option value="anthropic-api-key">Anthropic API Key</option>
              <option value="openrouter-api-key">OpenRouter API Key</option>
              <option value="gemini-api-key">Gemini API Key</option>
              <option value="zai-api-key">ZAI API Key</option>
              <option value="deepseek-api-key">DeepSeek API Key</option>
            </select>
            <label for="apiKey">API Key</label>
            <input id="apiKey" type="password" placeholder="粘贴 API Key" autocomplete="off" />
            <div class="row" style="margin-top: 8px">
              <button id="advancedSetupBtn" type="button">执行基础配置</button>
              <button id="oauthBtn" class="secondary" type="button">OpenAI OAuth 登录</button>
            </div>
            <div id="advancedOutput" class="mono small" style="margin-top: 8px"></div>
          </div>
        </details>
      </section>

      <section class="card">
        <h2>开始对话</h2>
        <div class="row">
          <div>
            <label for="sessionId">会话 ID</label>
            <input id="sessionId" value="thunderclaw-main" />
          </div>
          <div>
            <label for="thinking">思考强度（可选）</label>
            <select id="thinking">
              <option value="">默认</option>
              <option value="off">off</option>
              <option value="minimal">minimal</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
            </select>
          </div>
        </div>
        <label for="chatInput">消息</label>
        <textarea id="chatInput" placeholder="例如：你好，先自我介绍一下，然后告诉我你现在可以帮我做什么。"></textarea>
        <div class="row" style="margin-top: 8px">
          <button id="sendBtn" type="button">发送</button>
          <button id="clearBtn" class="secondary" type="button">清空聊天</button>
        </div>
        <div id="chatStream"></div>
      </section>
    </div>

    <script>
      const banner = document.getElementById("banner");
      const quickOutput = document.getElementById("quickOutput");
      const advancedOutput = document.getElementById("advancedOutput");
      const chatStream = document.getElementById("chatStream");

      const quickApiKey = document.getElementById("quickApiKey");
      const quickSetupBtn = document.getElementById("quickSetupBtn");
      const refreshBtn = document.getElementById("refreshBtn");

      const provider = document.getElementById("provider");
      const apiKey = document.getElementById("apiKey");
      const advancedSetupBtn = document.getElementById("advancedSetupBtn");
      const oauthBtn = document.getElementById("oauthBtn");

      const sessionId = document.getElementById("sessionId");
      const thinking = document.getElementById("thinking");
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const clearBtn = document.getElementById("clearBtn");

      function safe(text) {
        return String(text || "").replace(/[<>&]/g, (s) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[s]));
      }

      function renderMsg(role, text) {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        div.innerHTML = `<strong>${role === "user" ? "你" : "ThunderClaw"}</strong>\n${safe(text)}`;
        chatStream.appendChild(div);
        chatStream.scrollTop = chatStream.scrollHeight;
      }

      function setBanner(type, text) {
        banner.className = `status-banner ${type}`;
        banner.textContent = text;
      }

      async function apiCall(url, options = {}) {
        const res = await fetch(url, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        });
        const text = await res.text();
        let data = {};
        try {
          data = JSON.parse(text);
        } catch {
          data = { ok: false, raw: text };
        }
        if (!res.ok) {
          throw new Error(data.error || text || `HTTP ${res.status}`);
        }
        return data;
      }

      async function refreshStatus() {
        try {
          const status = await apiCall("/api/status");
          const ready = Boolean(status?.onboarding?.simpleReady);
          const openclawVersion = status?.openclaw?.version || "未知";
          if (ready) {
            setBanner("ok", `已就绪：OpenClaw ${openclawVersion}，可以直接在下方聊天。`);
          } else {
            setBanner("warn", `未完成基础配置：OpenClaw ${openclawVersion}。请先执行上方一键配置。`);
          }
        } catch (error) {
          setBanner("bad", `状态检查失败：${String(error)}`);
        }
      }

      quickSetupBtn.addEventListener("click", async () => {
        const key = quickApiKey.value.trim();
        if (!key) {
          quickOutput.textContent = "请先粘贴 DeepSeek API Key。";
          return;
        }
        quickOutput.textContent = "正在执行：配置模型 -> 写入配置 -> 启动 Gateway -> 健康检查...";
        try {
          const res = await apiCall("/api/setup/quick", {
            method: "POST",
            body: JSON.stringify({
              provider: "deepseek-api-key",
              apiKey: key,
            }),
          });
          quickOutput.textContent = [
            "✅ 基础配置完成",
            `Gateway: ${res?.gateway?.healthy ? "健康" : "未健康"}`,
            res?.next || "",
          ]
            .filter(Boolean)
            .join("\n");
          await refreshStatus();
        } catch (error) {
          quickOutput.textContent = `❌ 配置失败：${String(error)}`;
          setBanner("bad", "基础配置失败，请检查 API Key 或网络。");
        }
      });

      advancedSetupBtn.addEventListener("click", async () => {
        if (!apiKey.value.trim()) {
          advancedOutput.textContent = "请先输入 API Key。";
          return;
        }
        advancedOutput.textContent = "正在执行高级配置...";
        try {
          const res = await apiCall("/api/setup", {
            method: "POST",
            body: JSON.stringify({
              provider: provider.value,
              apiKey: apiKey.value,
              gatewayPort: 18789,
              gatewayAuth: "token",
            }),
          });
          advancedOutput.textContent = `ok=${res.ok} exitCode=${res.exitCode}\n${res.stderr || res.stdout || ""}`;
          await refreshStatus();
        } catch (error) {
          advancedOutput.textContent = `高级配置失败：${String(error)}`;
        }
      });

      oauthBtn.addEventListener("click", async () => {
        advancedOutput.textContent = "正在触发 OAuth 登录...";
        try {
          const res = await apiCall("/api/oauth/start", {
            method: "POST",
            body: JSON.stringify({ provider: "openai-codex" }),
          });
          advancedOutput.textContent = [
            res.message || "已触发 OAuth",
            res.command ? `命令：${res.command}` : "",
            "请回到启动 thunderclaw 的终端，按提示完成授权。",
          ]
            .filter(Boolean)
            .join("\n");
        } catch (error) {
          advancedOutput.textContent = `OAuth 失败：${String(error)}`;
        }
      });

      sendBtn.addEventListener("click", async () => {
        const text = chatInput.value.trim();
        if (!text) {
          return;
        }
        renderMsg("user", text);
        chatInput.value = "";
        renderMsg("assistant", "思考中...");
        const pending = chatStream.lastElementChild;
        try {
          const res = await apiCall("/api/chat", {
            method: "POST",
            body: JSON.stringify({
              message: text,
              sessionId: sessionId.value.trim() || "thunderclaw-main",
              thinking: thinking.value,
            }),
          });
          pending.innerHTML = `<strong>ThunderClaw</strong>\n${safe(res.reply || "(无回复文本)")}`;
        } catch (error) {
          pending.innerHTML = `<strong>ThunderClaw</strong>\n请求失败：${safe(String(error))}`;
        }
      });

      clearBtn.addEventListener("click", () => {
        chatStream.innerHTML = "";
      });

      refreshBtn.addEventListener("click", () => void refreshStatus());

      void refreshStatus();
    </script>
  </body>
</html>
